<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>if (/[?&]embed\b/.test(location.search)) document.documentElement.classList.add('embed');</script>
<title>T-Olimpians — Finał</title>
<meta name="robots" content="noindex">
<meta name="description" content="Kinowa animacja 2D w stylu T-Olimpians: finał Olimpiady Informatycznej, 100 punktów i podium.">
<link rel="icon" href="./img/favicon2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
    :root {
        --bg-base: #0a0a0f;
        --accent: #3b82f6;
        --accent-bright: #60a5fa;
        --accent-glow: rgba(59, 130, 246, 0.25);
        --text-primary: #f0f0f8;
        --text-secondary: #9090aa;
        --text-muted: #55556a;
        --border-accent: rgba(59, 130, 246, 0.3);
        --font-display: 'Syne', sans-serif;
        --font-body: 'DM Sans', sans-serif;
        --font-mono: 'JetBrains Mono', monospace;
        --bar: 0px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #000; overflow: hidden; }
    body { color: var(--text-primary); font-family: var(--font-body); }

    #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

    /* ─── LETTERBOX ─── */
    .bar {
        position: fixed; left: 0; right: 0; height: 0;
        background: #000; z-index: 5; pointer-events: none;
        transition: height 1.8s cubic-bezier(.7, 0, .2, 1);
    }
    .bar.top { top: 0; }
    .bar.bottom { bottom: 0; }
    body.rolling .bar { height: var(--bar); }

    /* ─── NAPISY ─── */
    .intro {
        position: fixed; inset: 0; z-index: 6;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        pointer-events: none; opacity: 0;
    }
    .intro-kicker {
        font-family: var(--font-display); font-weight: 800;
        font-size: clamp(22px, 3.2vw, 40px); letter-spacing: 0.32em; padding-left: 0.32em;
    }
    .intro-sub {
        font-family: var(--font-mono); font-size: clamp(10px, 1vw, 13px);
        letter-spacing: 0.5em; padding-left: 0.5em; text-transform: uppercase; color: var(--text-secondary);
    }

    .caption {
        position: fixed; left: clamp(16px, 4vw, 56px); bottom: calc(var(--bar) + clamp(14px, 3vh, 34px));
        z-index: 6; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
        font-family: var(--font-mono); font-size: clamp(10px, 1vw, 13px);
        letter-spacing: 0.22em; text-transform: uppercase; color: var(--text-primary);
        opacity: 0; pointer-events: none;
    }
    .caption .rec { width: 7px; height: 7px; border-radius: 50%; background: #ef4444; box-shadow: 0 0 12px #ef4444; }
    .caption .sep { color: var(--text-muted); }

    .title-card {
        position: fixed; inset: 0; z-index: 6;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center; padding: 0 16px; pointer-events: none; opacity: 0;
    }
    .title-card .kicker {
        font-family: var(--font-mono); font-size: clamp(10px, 1vw, 13px);
        letter-spacing: 0.5em; padding-left: 0.5em; color: var(--accent-bright); margin-bottom: 14px;
    }
    .title-card h1 {
        font-family: var(--font-display); font-weight: 800;
        font-size: clamp(38px, 8.4vw, 124px); line-height: 0.95; letter-spacing: 0.02em;
        text-shadow: 0 0 40px rgba(59,130,246,0.45), 0 0 120px rgba(59,130,246,0.25);
    }
    .title-card p {
        margin-top: 18px; font-size: clamp(14px, 1.6vw, 21px); font-weight: 300; color: var(--text-primary); opacity: .9;
    }
    .title-card .chips { margin-top: 22px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    .title-card .chips span {
        font-family: var(--font-mono); font-size: clamp(10px, 0.95vw, 12px); letter-spacing: 0.14em;
        padding: 6px 14px; border-radius: 100px; border: 1px solid var(--border-accent);
        background: rgba(10,10,15,0.55); color: var(--text-primary);
        backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    }

    /* ─── EKRAN STARTOWY ─── */
    .start {
        position: fixed; inset: 0; z-index: 20;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px;
        background: radial-gradient(ellipse at 50% 40%, #111122 0%, var(--bg-base) 60%, #000 100%);
        transition: opacity 0.9s ease, visibility 0.9s;
        padding: 16px; text-align: center;
    }
    .start.hidden { opacity: 0; visibility: hidden; }
    .start img {
        width: clamp(150px, 22vw, 240px); height: auto; border-radius: 22px;
        box-shadow: 0 0 0 1px rgba(255,255,255,0.07), 0 30px 80px rgba(0,0,0,0.6), 0 0 80px var(--accent-glow);
        animation: float 5s ease-in-out infinite;
    }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .start h2 { font-family: var(--font-display); font-weight: 700; font-size: clamp(20px, 2.4vw, 30px); letter-spacing: 0.01em; }
    .start .hint { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.18em; color: var(--text-secondary); text-transform: uppercase; }
    .btn {
        font-family: var(--font-body); font-weight: 600; font-size: 15px; letter-spacing: 0.02em;
        color: #fff; background: var(--accent); border: 0; border-radius: 100px;
        padding: 14px 34px; cursor: pointer; display: inline-flex; align-items: center; gap: 10px;
        box-shadow: 0 10px 40px var(--accent-glow);
        transition: background 0.2s, transform 0.2s, box-shadow 0.2s, opacity 0.2s;
    }
    .btn:hover { background: var(--accent-bright); transform: translateY(-2px); box-shadow: 0 14px 50px rgba(59,130,246,0.4); }
    .btn:disabled { opacity: 0.55; cursor: progress; transform: none; }
    .btn:focus-visible { outline: 2px solid var(--accent-bright); outline-offset: 3px; }

    /* ─── STEROWANIE ─── */
    .controls {
        position: fixed; right: clamp(16px, 3vw, 40px); bottom: calc(var(--bar) + clamp(12px, 2.6vh, 30px));
        z-index: 8; display: flex; gap: 8px; opacity: 0; transition: opacity 0.5s ease;
    }
    body.show-controls .controls, body.ended .controls { opacity: 1; }
    .ctrl {
        font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.08em;
        color: var(--text-primary); background: rgba(10,10,15,0.7);
        border: 1px solid var(--border-accent); border-radius: 100px;
        padding: 9px 16px; cursor: pointer;
        backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        transition: background 0.2s, border-color 0.2s;
    }
    .ctrl:hover { background: rgba(59,130,246,0.18); border-color: var(--accent-bright); }
    .ctrl:focus-visible { outline: 2px solid var(--accent-bright); outline-offset: 2px; }
    .ctrl.back { text-decoration: none; display: inline-flex; align-items: center; }

    /* ─── TRYB OSADZONY (animacja powitalna na stronie głównej) ─── */
    html.embed .start, html.embed #replayBtn, html.embed .ctrl.back { display: none; }
    #skipBtn { display: none; }
    html.embed #skipBtn { display: inline-flex; }
    html.embed .controls { opacity: 0.6; }
    html.embed body.show-controls .controls { opacity: 1; }
    .embed-loading {
        position: fixed; inset: 0; z-index: 7; display: flex; align-items: center; justify-content: center;
        font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.3em; color: var(--text-secondary);
        opacity: 0; transition: opacity 0.4s ease; pointer-events: none;
    }
    .embed-loading.on { opacity: 1; }

    @media (max-width: 600px) {
        .ctrl { padding: 8px 12px; font-size: 11px; }
        .controls { left: 16px; right: 16px; justify-content: center; flex-wrap: wrap; }
    }
</style>
</head>
<body>
<canvas id="stage" aria-label="Animacja: finał Olimpiady Informatycznej — uczestnik dostaje 100 punktów i staje na podium"></canvas>

<div class="bar top"></div>
<div class="bar bottom"></div>

<div class="intro" id="intro">
    <span class="intro-kicker">T-OLIMPIANS</span>
    <span class="intro-sub">przedstawia</span>
</div>

<div class="caption" id="caption">
    <span class="rec"></span>
    <span>NA ŻYWO</span><span class="sep">/</span><span>Finał Olimpiady Informatycznej</span><span class="sep">/</span><span>ostatnie minuty</span>
</div>

<div class="title-card" id="titleCard">
    <div class="kicker">TEAM POLAND</div>
    <h1>T-OLIMPIANS</h1>
    <p>Zostań jednym z najlepszych.</p>
    <div class="chips"><span>OI</span><span>OIJ</span><span>BOI</span><span>IOI</span></div>
</div>

<div class="start" id="start">
    <img src="img/t-olimpians-network-logo.png" alt="Logo T-Olimpians">
    <h2>Finał</h2>
    <button class="btn" id="playBtn" type="button" disabled>Ładowanie muzyki…</button>
    <span class="hint">z dźwiękiem · spacja = pauza · R = od nowa</span>
</div>

<div class="embed-loading" id="embedLoading">ŁADOWANIE…</div>

    <button class="ctrl" id="soundBtn" type="button">DŹWIĘK: WŁ</button>
    <button class="ctrl" id="replayBtn" type="button">↺ OD NOWA</button>
    <button class="ctrl" id="skipBtn" type="button">POMIŃ ›</button>
    <a class="ctrl back" href="index.html">T-OLIMPIANS →</a>
</div>

<script>
(() => {
'use strict';

/* ════════════════════════════════════════════════════════════
   NARZĘDZIA
   ════════════════════════════════════════════════════════════ */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, t) => { const x = clamp((t - a) / (b - a), 0, 1); return x * x * (3 - 2 * x); };
const easeIO = (a, b, t) => { const x = clamp((t - a) / (b - a), 0, 1); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const easeOut = (a, b, t) => { const x = clamp((t - a) / (b - a), 0, 1); return 1 - Math.pow(1 - x, 3); };
const easeBack = (a, b, t) => { const x = clamp((t - a) / (b - a), 0, 1), c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerpP = (p, q, t) => [lerp(p[0], q[0], t), lerp(p[1], q[1], t)];
const TAU = Math.PI * 2;
// Deterministyczny szum — każde odtworzenie wygląda identycznie
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

// Dwusegmentowe IK — zwraca [staw pośredni, koniec]
function ik(a, b, l1, l2, dir) {
    const dx = b[0] - a[0], dy = b[1] - a[1];
    let d = Math.hypot(dx, dy);
    d = clamp(d, Math.abs(l1 - l2) + 0.01, (l1 + l2) * 0.9995);
    const base = Math.atan2(dy, dx);
    const A = Math.acos(clamp((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d), -1, 1));
    const ang = base + dir * A;
    const j = [a[0] + Math.cos(ang) * l1, a[1] + Math.sin(ang) * l1];
    const ex = b[0] - j[0], ey = b[1] - j[1], el = Math.hypot(ex, ey) || 1;
    return [j, [j[0] + ex / el * l2, j[1] + ey / el * l2]];
}

/* ════════════════════════════════════════════════════════════
   RYTM UTWORU (zmierzony z pliku: 180 BPM)
   bit co 1/3 s, takt co 4/3 s, pierwsza „raz” taktu = 0.78 s
   zwrotka od 4.78 s · przerwa 24.78–27.45 s · drop 27.45 s
   ════════════════════════════════════════════════════════════ */
const BEAT = 1 / 3, B0 = 0.113, BAR = 4 / 3, D0 = 0.78;
const bar = n => D0 + n * BAR;
const frac = x => x - Math.floor(x);
const beatPhase = t => frac((t - B0) / BEAT);
const barPhase = t => frac((t - D0) / BAR);
const beatPulse = (t, k = 7) => Math.exp(-beatPhase(t) * BEAT * k);
const barPulse = (t, k = 5) => Math.exp(-barPhase(t) * BAR * k);

const T = {
    walkStart: bar(3), walkEnd: bar(9),                 // wejście na „raz” zwrotki
    sitStart: bar(9) + 0.1, sitEnd: bar(10),
    scootStart: bar(10), scootEnd: bar(10) + 0.5,
    handsStart: bar(10) + 0.45, handsEnd: bar(10) + 1.05,
    press: bar(11) - 0.03, bootStart: bar(11),
    typeStart: bar(12), typeEnd: bar(17) + 2 * BEAT,
    submit: bar(17) + 3 * BEAT,
    judgeStart: bar(18),                                // przerwa w muzyce — napięcie
    testAt: i => bar(18) + (i + 1) / 6,                 // testy co pół bitu
    verdict: bar(19) + BEAT,
    white: bar(20) - 0.55,
    podium: bar(20),                                    // DROP
    trophyUp: bar(20) + 2 * BEAT,                      // puchar w górę zaraz po błysku
    pullBack: bar(22),
    sweep: bar(24),
    title: bar(26),
    fadeOut: bar(31),
    end: bar(34)
};
const energy = t => t < bar(3) ? 0.3 : t < T.judgeStart ? 0.6 : t < T.podium ? 0.15 : 1;

/* ════════════════════════════════════════════════════════════
   MUZYKA — WebAudio, zegar animacji = pozycja w utworze
   ════════════════════════════════════════════════════════════ */
const SONG = 'sound/apex-legends-song.mp3';
const Music = (() => {
    // Tryb 1: WebAudio — dekodowany plik, zegar co do próbki.
    // Tryb 2: zwykły <audio> — gdy strona jest otwarta z dysku (file://) i fetch nie działa.
    let ac = null, gain = null, buf = null, src = null, startAt = 0, from = 0, raw = null, vol = -1;
    let el = null, elOn = false, anchorT = 0, anchorNow = 0, onFail = () => {};
    const isFile = location.protocol === 'file:' || /[?&]audio=element\b/.test(location.search);
    const rawP = (isFile ? Promise.reject(new Error('file')) : fetch(SONG).then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); }))
        .then(a => { raw = a; })
        .catch(() => {});
    const now = () => performance.now() / 1000;
    function makeElement() {
        if (el) return;
        el = new Audio(SONG);
        el.preload = 'auto';
        el.addEventListener('error', () => onFail());
    }
    // Wywoływane synchronicznie w kliknięciu — przeglądarka pozwala wtedy na dźwięk
    function unlock() {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC && !ac) { try { ac = new AC(); gain = ac.createGain(); gain.connect(ac.destination); } catch (e) { ac = null; } }
        if (ac && ac.state === 'suspended') ac.resume().catch(() => {});
        if (isFile || (!raw && !buf)) {
            makeElement();
            if (!elOn) {
                el.muted = true;
                const p = el.play();
                if (p) p.then(() => { if (!elOn) el.pause(); el.muted = false; }).catch(() => { el.muted = false; });
            }
        }
    }
    async function prepare() {
        await rawP;
        if (raw && ac && !buf) {
            try { buf = await new Promise((res, rej) => ac.decodeAudioData(raw.slice(0), res, rej)); } catch (e) { buf = null; }
        }
        if (!buf) makeElement();
        return !!(buf || el);
    }
    function stop() {
        if (src) { try { src.stop(); } catch (e) {} src.disconnect(); src = null; }
        if (el) { el.pause(); elOn = false; }
    }
    function play(at = 0) {
        stop();
        at = Math.max(0, at);
        if (buf) {
            if (ac.state === 'suspended') ac.resume().catch(() => {});
            src = ac.createBufferSource(); src.buffer = buf; src.connect(gain);
            startAt = ac.currentTime + 0.05; from = at;
            src.start(startAt, at);
        } else if (el) {
            el.muted = false;
            el.currentTime = at;
            anchorT = at; anchorNow = now(); elOn = true;
            const p = el.play();
            if (p) p.catch(() => { elOn = false; onFail(); });
        }
    }
    function time() {
        if (src) return ac.state === 'running' ? from + (ac.currentTime - startAt) - (ac.outputLatency || ac.baseLatency || 0) : null;
        if (el && elOn) {
            // currentTime w <audio> skacze co kilkadziesiąt ms — wygładzamy zegarem przeglądarki
            const n = now(), real = el.currentTime;
            if (el.paused) { anchorT = real; anchorNow = n; return real; }
            let est = anchorT + (n - anchorNow);
            if (Math.abs(real - est) > 0.15) { anchorT = real; anchorNow = n; est = real; }
            else anchorT += (real - est) * 0.03;
            return est;
        }
        return null;
    }
    function setVolume(v) {
        if (Math.abs(v - vol) < 0.005) return;
        vol = v;
        if (gain) gain.gain.setTargetAtTime(v, ac.currentTime, 0.04);
        if (el) el.volume = clamp(v, 0, 1);
    }
    return {
        rawP, unlock, prepare, play, stop, time, setVolume,
        pause() { if (src && ac) ac.suspend(); if (el && elOn) el.pause(); },
        resume() { if (src && ac) ac.resume(); if (el && elOn && el.paused) el.play().catch(() => onFail()); },
        set onFail(fn) { onFail = fn; },
        get ready() { return !!(buf || el); }
    };
})();

/* ════════════════════════════════════════════════════════════
   PŁÓTNO I KAMERA
   Świat: oś Y w górę, podłoga na y = 0, jednostka ≈ 1 cm.
   Tło (ściana + dalsze rzędy) rysujemy na osobnym płótnie
   w niższej rozdzielczości — można je tanio rozmyć (głębia ostrości).
   ════════════════════════════════════════════════════════════ */
const cvs = document.getElementById('stage');
const main = cvs.getContext('2d');
const bgCvs = document.createElement('canvas');
const bgCtx = bgCvs.getContext('2d');
const BG_RES = 0.6;
let ctx = main;
let LWK = null;                   // stała grubość kresek (np. na ekranie monitora)
let W = 0, H = 0, DPR = 1, frameH = 0, barH = 0, BASE = 1;
const cam = { x: 0, y: 0, z: 1 };

function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cvs.width = Math.round(W * DPR); cvs.height = Math.round(H * DPR);
    bgCvs.width = Math.round(W * DPR * BG_RES); bgCvs.height = Math.round(H * DPR * BG_RES);
    const aspect = W / H >= 1 ? 2.39 : 1.15;          // kinowe 2.39:1, na telefonie pionowo łagodniej
    frameH = Math.min(H, W / aspect);
    barH = Math.max(0, (H - frameH) / 2);
    document.documentElement.style.setProperty('--bar', barH + 'px');
    BASE = frameH / 380;                              // przy zoomie 1 kadr mieści 380 jednostek wysokości
}
function setWorld(k = 1) {
    const S = BASE * cam.z, d = DPR * k;
    ctx.setTransform(S * d, 0, 0, -S * d, (W / 2 - cam.x * S) * d, (H / 2 + cam.y * S) * d);
}
function setScreen() { ctx.setTransform(DPR, 0, 0, DPR, 0, 0); }
const lw = w => LWK ? w * LWK : w / Math.pow(cam.z, 0.55);
// Warstwa głębi: s < 1 dalej (wolniej się przesuwa, mniejsza), s > 1 bliżej
function layer(s, lift) {
    ctx.translate(cam.x * (1 - s), lift + cam.y * (1 - s) * 0.15);
    ctx.scale(s, s);
}
const layerX = (X, s) => cam.x * (1 - s) + X * s;
const halfView = () => W / 2 / (BASE * cam.z);

/* ════════════════════════════════════════════════════════════
   PALETA (T-Olimpians: czerń, biel line-art, niebieski akcent)
   ════════════════════════════════════════════════════════════ */
const C = {
    line: 'rgba(240,240,248,0.92)',
    lineMid: 'rgba(240,240,248,0.55)',
    lineDim: 'rgba(240,240,248,0.3)',
    lineFaint: 'rgba(240,240,248,0.12)',
    fill: '#0f0f17',
    accent: '#3b82f6',
    accentB: '#60a5fa',
    gold: '#e8c170',
    green: '#34d399',
    red: '#ef4444'
};

/* ════════════════════════════════════════════════════════════
   PODSTAWOWE KSZTAŁTY
   ════════════════════════════════════════════════════════════ */
function rrect(x, y, w, h, r) {
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
}
function shape(fill, stroke, width) {
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw(width); ctx.stroke(); }
}
function line(pts, stroke, width) {
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.strokeStyle = stroke; ctx.lineWidth = lw(width); ctx.stroke();
}
// Tekst w świecie (oś Y w górę) — lokalnie odwracamy
function text(str, x, y, font, color, align = 'center', base = 'alphabetic') {
    ctx.save();
    ctx.translate(x, y); ctx.scale(1, -1);
    ctx.font = font; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = base;
    ctx.fillText(str, 0, 0);
    ctx.restore();
}
// Czteroramienna iskra z logo
function sparkle(x, y, s, color) {
    ctx.beginPath();
    ctx.moveTo(x, y + s);
    ctx.quadraticCurveTo(x, y, x + s, y);
    ctx.quadraticCurveTo(x, y, x, y - s);

    ctx.fillStyle = color; ctx.fill();
}

/* ─── Siatkowy glob z logo T-Olimpians ─── */
function globe(cx, cy, r, spin, alpha, width, ring = true) {
    const tilt = -0.42, ct = Math.cos(tilt), st = Math.sin(tilt);
    const front = new Path2D(), back = new Path2D();
    const proj = (lat, lon) => {
        const x = Math.cos(lat) * Math.sin(lon + spin), y = Math.sin(lat), z = Math.cos(lat) * Math.cos(lon + spin);
        return [cx + r * x, cy + r * (y * ct - z * st), y * st + z * ct];
    };
    const trace = pts => {
        for (let i = 1; i < pts.length; i++) {
            const p = pts[i - 1], q = pts[i];
            const P = (p[2] > 0 && q[2] > 0) ? front : back;
            P.moveTo(p[0], p[1]); P.lineTo(q[0], q[1]);
        }
    };
    const N = 56;
    for (let la = -75; la <= 75; la += 15) {
        const pts = [];
        for (let i = 0; i <= N; i++) pts.push(proj(la * Math.PI / 180, i / N * TAU));
        trace(pts);
    }
    for (let lo = 0; lo < 360; lo += 15) {
        const pts = [];
        for (let i = 0; i <= N; i++) pts.push(proj(-Math.PI / 2 + i / N * Math.PI, lo * Math.PI / 180));
        trace(pts);
    }
    ctx.lineCap = 'round';
    ctx.strokeStyle = `rgba(240,240,248,${alpha * 0.13})`; ctx.lineWidth = lw(width * 0.8); ctx.stroke(back);
    ctx.strokeStyle = `rgba(240,240,248,${alpha})`; ctx.lineWidth = lw(width); ctx.stroke(front);
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU);
    ctx.strokeStyle = `rgba(240,240,248,${alpha})`; ctx.lineWidth = lw(width * 1.3); ctx.stroke();
    if (!ring) return;
    const rx = r * 1.5, ry = r * 0.3, rot = 0.16, cr = Math.cos(rot), sr = Math.sin(rot);
    ctx.beginPath();
    let pen = false;
    for (let i = 0; i <= 120; i++) {
        const a = i / 120 * TAU, ex = Math.cos(a) * rx, ey = Math.sin(a) * ry;
        const px = cx + ex * cr - ey * sr, py = cy + ex * sr + ey * cr;
        if (Math.sin(a) > 0 && Math.hypot(px - cx, py - cy) < r * 1.06) { pen = false; continue; }
        if (!pen) { ctx.moveTo(px, py); pen = true; } else ctx.lineTo(px, py);
    }
    ctx.strokeStyle = `rgba(240,240,248,${alpha})`; ctx.lineWidth = lw(width * 2.2); ctx.stroke();
}

function tokenize(l) {
    if (/^\s*\/\//.test(l)) return [[l, COL.com]];
    if (/^\s*#/.test(l)) { const m = l.match(/^(\s*#\w+)(.*)$/); return [[m[1], COL.pre], [m[2], COL.str]]; }
    const out = []; let s = l;
    while (s.length) {

        else if ((m = s.match(/^(int|long|for|auto|using|namespace|return|const)\b/))) out.push([m[0], COL.kw]);
        else if ((m = s.match(/^(vector|sort|max|cin|cout|rbegin|rend|std|ios|sync_with_stdio|tie)\b/))) out.push([m[0], COL.fn]);
        else if ((m = s.match(/^\d+/))) out.push([m[0], COL.num]);
        else if ((m = s.match(/^'(?:\\.|[^'])*'/))) out.push([m[0], COL.str]);
        else if ((m = s.match(/^[A-Za-z_]\w*/))) out.push([m[0], COL.def]);
        else { m = [s[0]]; out.push([m[0], COL.pun]); }
        s = s.slice(m[0].length);

}

    ctx.fillStyle = gl; ctx.fillRect(0, 0, MON.w, MON.h);

    if (G.light > 0) line([[KB.x0 + 2, DESK.top + 3.3], [KB.x1 - 2, DESK.top + 3.3]], `rgba(96,165,250,${0.7 * G.light})`, 1.1);
    // kubek z parą i butelka wody
    rrect(390, DESK.top, 13, 15, 2); shape(C.fill, C.line, 1.4);
    ctx.beginPath(); ctx.arc(404, DESK.top + 8, 4, -Math.PI / 2, Math.PI / 2); ctx.strokeStyle = C.line; ctx.lineWidth = lw(1.3); ctx.stroke();
    text('</>', 396.5, DESK.top + 6, '700 4.5px "JetBrains Mono"', 'rgba(96,165,250,0.85)');
    for (let i = 0; i < 2; i++) {
        const ph = t * 0.6 + i * 1.7, bx = 394 + i * 5, by = DESK.top + 17;
        ctx.beginPath(); ctx.moveTo(bx, by);
        ctx.bezierCurveTo(bx + 4 * Math.sin(ph * 3), by + 8, bx - 4 * Math.sin(ph * 2.3), by + 14, bx + 2 * Math.sin(ph * 4), by + 24);
        ctx.strokeStyle = `rgba(240,240,248,${0.12 + 0.08 * Math.sin(ph * 2)})`; ctx.lineWidth = lw(1.1); ctx.stroke();
    }
    drawBottle(420);
    rubberDuck(368);
    for (const [dy, rot, col] of [[12, -0.1, '#f4d35e'], [-2, 0.08, '#f28bb0']]) {      // karteczki na boku monitora
        ctx.save(); ctx.translate(MON.x + MON.w / 2 + 6, MON.y + dy); ctx.rotate(rot);
        rrect(-5, -5, 10, 10, 0.8); shape(col, 'rgba(0,0,0,0.3)', 0.6);
        line([[-3.5, 1.5], [3, 1.5]], 'rgba(30,30,40,0.55)', 0.5);
        line([[-3.5, -1], [2, -1]], 'rgba(30,30,40,0.55)', 0.5);
        ctx.restore();
    }
}

/* ════════════════════════════════════════════════════════════
   POSTAĆ Z PROFILU — szkielet 2D, kontur line-art jak w logo
   ════════════════════════════════════════════════════════════ */
const BODY = { thigh: 46, shin: 46, torso: 60, shoulder: 53, neck: 8, head: 13, upper: 32, fore: 30 };
const STRIDE = 152;
const WALK_V = STRIDE / BAR;                    // pełny cykl kroku = 1 takt → pięta na co drugi bit
const WALK_DEC = BAR;
const WALK_D = WALK_V * (T.walkEnd - T.walkStart - WALK_DEC) + WALK_V * WALK_DEC / 2;
const WALK_X0 = 200 - WALK_D;
function walkX(t) {
    const dt = t - T.walkStart, Tc = T.walkEnd - T.walkStart - WALK_DEC;
    if (dt < Tc) return WALK_X0 + WALK_V * dt;
    const u = Math.min(dt - Tc, WALK_DEC);
    return WALK_X0 + WALK_V * Tc + WALK_V * u - WALK_V * u * u / (2 * WALK_DEC);
}
const shoulderOf = (h, ln) => [h[0] + Math.sin(ln) * BODY.shoulder, h[1] + Math.cos(ln) * BODY.shoulder];
function headCenter(hip, lean, tilt) {
    const nt = [hip[0] + Math.sin(lean) * BODY.torso, hip[1] + Math.cos(lean) * BODY.torso];
    const ha = lean + tilt, r = BODY.neck + BODY.head - 2;
    return [nt[0] + Math.sin(ha) * r, nt[1] + Math.cos(ha) * r];
}

/* ════════════════════════════════════════════════════════════
   PISANIE NA KLAWIATURZE
   Bohater uderza w klawisze na szesnastkach utworu (12/s), na zmianę
   rękami; dłoń przechodzi łukiem nad kolejny klawisz, palec wciska klawisz.
   ════════════════════════════════════════════════════════════ */
const KB = { x0: 207, x1: 253 };                 // klawiatura bliżej krawędzi biurka
const KEY_TOP = DESK.top + 4.7;                  // górna powierzchnia klawiszy
const STROKE_T = BEAT / 4;
const HERO_T0 = B0 + Math.ceil((T.typeStart - B0) / STROKE_T) * STROKE_T;
const HERO_N = Math.floor((T.typeEnd - HERO_T0) / STROKE_T) + 1;
const HAND_BASE = [57, 86.5, 49, 87];            // nadgarstki: [dx od biodra, y] bliskiej i dalekiej ręki
let HERO_KEYS = null;                            // wciśnięte klawisze bohatera (dla podświetlenia)

function strokeAt(k, seed) {
    const h = hash(k * 1.37 + seed * 7.1);
    return { hand: (k + (h > 0.82 ? 1 : 0)) % 2, row: h < 0.55 ? 0 : h < 0.78 ? -1 : 1, accent: k % 4 === 0 };
}
// Ruch jednej ręki (0 = bliska, 1 = daleka): przesunięcie między rzędami, łuk nad klawiszami, nacisk
function handTyping(t, hand, t0, period, seed) {
    const k = Math.floor((t - t0) / period);
    let kp = k, kn = k + 1;
    while (kp > k - 8 && strokeAt(kp, seed).hand !== hand) kp--;
    while (kn < k + 9 && strokeAt(kn, seed).hand !== hand) kn++;
    const tp = t0 + kp * period, tn = t0 + kn * period;
    const sp = strokeAt(kp, seed), sn = strokeAt(kn, seed);
    const u = clamp((t - tp) / (tn - tp), 0, 1);
    const press = clamp(Math.exp(-Math.pow((t - tp - 0.028) / 0.03, 2)) * (sp.accent ? 1.15 : 1), 0, 1);
    return {
        dx: lerp(sp.row, sn.row, smooth(0.25, 0.9, u)) * 2.4,
        dy: Math.sin(Math.PI * u) * 1.3 * (1 - press) - 0.7 * press,
        press
    };
}
// Dłoń nad klawiaturą: kciuk, dwa palce i grzbiet dłoni; palec wskazujący dotyka klawisza
function typingHand(wr, el, press, skin, stroke) {
    const L = Math.hypot(wr[0] - el[0], wr[1] - el[1]) || 1;
    const d = [(wr[0] - el[0]) / L, (wr[1] - el[1]) / L];
    const kn = [wr[0] + d[0] * 5.2, wr[1] + d[1] * 5.2 - 0.8];
    limb(wr, [wr[0] + 2, wr[1] - 1.8], [wr[0] + 4, wr[1] - 3.4], 2.2, stroke, skin);          // kciuk
    for (const [ox, hov] of [[1.8, 1.6], [0, (1 - press) * 1.5]]) {                              // środkowy, wskazujący
        const tip = [kn[0] + 4.3 + ox, KEY_TOP + hov];
        ctx.beginPath(); ctx.moveTo(kn[0], kn[1]);
        ctx.quadraticCurveTo(kn[0] + 3.6 + ox, kn[1] + 0.8, tip[0], tip[1]);
        ctx.lineCap = 'round';
        ctx.strokeStyle = stroke; ctx.lineWidth = 2.3 + 2 * lw(1.2); ctx.stroke();
        ctx.strokeStyle = skin; ctx.lineWidth = 2.3; ctx.stroke();
    }
    limb(wr, lerpP(wr, kn, 0.5), kn, 5.4, stroke, skin);                                        // dłoń
}

function heroPose(t) {
    let kbW = 0, pressN = 0, pressF = 0;
    const x = walkX(t);
    const v = (walkX(t + 0.02) - x) / 0.02;
    const amp = smooth(0, 0.55, v / WALK_V);
    const p = (x - WALK_X0) / STRIDE * TAU + Math.PI / 2;
    const leg = ph => {
        const a1 = 0.44 * amp * Math.sin(ph);
        const a2 = a1 - amp * (0.08 + 0.85 * Math.pow(Math.max(0, Math.cos(ph)), 2));
        return { reach: BODY.thigh * Math.cos(a1) + BODY.shin * Math.cos(a2), dx: BODY.thigh * Math.sin(a1) + BODY.shin * Math.sin(a2) };
    };
    const lN = leg(p), lF = leg(p + Math.PI);
    let hip = [x, 5 + Math.max(lN.reach, lF.reach)];
    let ankN = [x + lN.dx, hip[1] - lN.reach], ankF = [x + lF.dx, hip[1] - lF.reach];
    // pewny, „luźny” chód: lekkie kołysanie i kiwanie głową na bit
    let lean = 0.02 + 0.05 * amp + 0.02 * amp * Math.sin(2 * p) + 0.01 * Math.sin(t * 1.8);
    let headTilt = 0.06 * amp * beatPulse(t, 10) - 0.03 * amp;
    const armFK = (sh, ph) => {
        const s = -0.42 * amp * Math.sin(ph), e = 0.2 + 0.32 * amp * Math.max(0, -Math.sin(ph));
        return [sh[0] + Math.sin(s) * BODY.upper + Math.sin(s + e) * BODY.fore, sh[1] - Math.cos(s) * BODY.upper - Math.cos(s + e) * BODY.fore];
    };
    let sh = shoulderOf(hip, lean);
    let handN = armFK(sh, p), handF = armFK(sh, p + Math.PI);

    if (t > T.sitStart) {
        const k = easeIO(T.sitStart, T.sitEnd, t);
        const scoot = easeIO(T.scootStart, T.scootEnd, t) * 14;
        hip = [lerp(200, 150, easeIO(T.sitStart, T.sitEnd - 0.25, t)) + scoot, lerp(hip[1], 54, easeIO(T.sitStart + 0.12, T.sitEnd, t))];
        ankN = lerpP(ankN, [206, 5], k);
        ankF = lerpP(ankF, [198, 5], k);
        lean = lerp(lean, 0.17, k) + 0.42 * Math.sin(Math.PI * k) - 0.03 * Math.sin(Math.PI * easeIO(T.scootStart, T.scootEnd, t));
        sh = shoulderOf(hip, lean);
        const rest = [hip[0] + 30, hip[1] + 9];
        handN = lerpP(handN, rest, k);
        handF = lerpP(handF, [rest[0] - 5, rest[1] + 1], k);
        const kb = easeIO(T.handsStart, T.handsEnd, t);
        const typeW = smooth(T.typeStart - 0.4, T.typeStart, t) * (1 - smooth(T.typeEnd, T.typeEnd + 0.4, t));
        const a = handTyping(t, 0, HERO_T0, STROKE_T, 3), b = handTyping(t, 1, HERO_T0, STROKE_T, 3);
        const kN = [hip[0] + HAND_BASE[0] + a.dx * typeW, HAND_BASE[1] + a.dy * typeW];
        const kF = [hip[0] + HAND_BASE[2] + b.dx * typeW, HAND_BASE[3] + b.dy * typeW];
        pressN = a.press * typeW; pressF = b.press * typeW;
        // pojedyncze, mocne naciśnięcia: włączenie komputera i wysłanie (z zamachem)
        for (const at of [T.press, T.submit]) {
            const lift = Math.exp(-Math.pow((t - at + 0.14) / 0.07, 2)), hit = Math.exp(-Math.pow((t - at - 0.02) / 0.035, 2));
            kN[1] += 5 * lift - 0.8 * hit;
            pressN = Math.max(pressN, hit);
        }
        handN = lerpP(handN, kN, kb); handF = lerpP(handF, kF, kb);
        kbW = kb;
        headTilt = 0.06 * kb + 0.05 * beatPulse(t, 10) * smooth(T.typeStart, T.typeStart + 0.4, t) * (1 - smooth(T.typeEnd, T.submit + 0.2, t));
        // Przerwa: pochylenie do ekranu (napięcie)
        const tense = easeIO(T.judgeStart, T.judgeStart + 1.2, t) * (1 - easeOut(T.verdict, T.verdict + 0.2, t));
        lean += 0.1 * tense; headTilt += 0.05 * tense;
        sh = shoulderOf(hip, lean);
        // Werdykt: ręce w górę!
        const c = easeOut(T.verdict, T.verdict + 0.22, t);
        if (c > 0) {
            lean = lerp(lean, -0.12, c);
            headTilt = lerp(headTilt, -0.15, c);
            sh = shoulderOf(hip, lean);
            const pump = 4 * beatPulse(t, 12);
            handN = lerpP(handN, [sh[0] + 20, sh[1] + 56 + pump], c);
            handF = lerpP(handF, [sh[0] - 4, sh[1] + 58 + pump], c);
        }
        kbW *= 1 - c;
    }
    return { hip, ankN, ankF, lean, headTilt, sh, handN, handF, kb: kbW, kbF: kbW, pressN, pressF, keyN: handN[0] + 9.2, keyF: handF[0] + 9.2 };
}

// Pozostali uczestnicy: piszą, kiwają głową do rytmu albo myślą z ręką przy brodzie
function seatedPose(seatX, t, id) {
    const hip = [seatX + 14, 54];
    const off = hash(id) * 5, segLen = BAR * 2;
    const seg = Math.floor((t + off) / segLen), u = frac((t + off) / segLen);
    const r = hash(seg * 13.1 + id * 0.7);
    const env = smooth(0, 0.12, u) * (1 - smooth(0.88, 1, u));
    const think = r < 0.2 ? env : 0, bob = r > 0.55 ? env : 0;
    let lean = 0.17 - 0.13 * think + 0.01 * Math.sin(t * 1.3 + id);
    let headTilt = 0.06 - 0.12 * think + 0.07 * bob * beatPulse(t, 10) + 0.015 * Math.sin(t * 2 + id);
    const sh = shoulderOf(hip, lean);
    const period = 1 / (7 + hash(id * 2) * 5), t0 = hash(id) * 3;
    const wN = 1 - think, wF = 1 - 0.8 * think;
    const a = handTyping(t, 0, t0, period, id), b = handTyping(t, 1, t0, period, id);
    let handN = [hip[0] + HAND_BASE[0] + a.dx * wN, HAND_BASE[1] + a.dy * wN];
    const handF = [hip[0] + HAND_BASE[2] + b.dx * wF, HAND_BASE[3] + b.dy * wF];
    if (think > 0) {
        const hc = headCenter(hip, lean, headTilt);
        handN = lerpP(handN, [hc[0] + 7, hc[1] - 12], think);
    }
    return { hip, ankN: [seatX + 56, 5], ankF: [seatX + 48, 5], lean, headTilt, sh, handN, handF,
        kb: 1 - think, kbF: 1, pressN: a.press * wN, pressF: b.press * wF, keyN: handN[0] + 9.2, keyF: handF[0] + 9.2 };
}

function limb(a, b, c, w, stroke, fill, trim = false) {
    if (trim) {
        const dx = c[0] - b[0], dy = c[1] - b[1], L = Math.hypot(dx, dy), k = (w / 2 + lw(1.5)) / (L || 1);
        if (k < 1) c = [c[0] - dx * k, c[1] - dy * k];
    }
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.lineTo(c[0], c[1]);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.strokeStyle = stroke; ctx.lineWidth = w + 2 * lw(1.5); ctx.stroke();
    ctx.strokeStyle = fill; ctx.lineWidth = w; ctx.stroke();
}
/* ─── Fryzury — wspólne narzędzia ─── */
const hairCol = st => st.hairCol || '#0c0c13';
function hairFill(st, w = 1.4) { shape(hairCol(st), C.line, w); }
// Pasma: [x0,y0, cx,cy, x,y] (kwadratowa) albo [x0,y0, c1x,c1y, c2x,c2y, x,y] (Béziera)
function strands(list, a = 0.3, w = 0.8) {
    ctx.save();
    ctx.strokeStyle = `rgba(240,240,248,${a})`; ctx.lineWidth = lw(w); ctx.lineCap = 'round';
    for (const p of list) {
        ctx.beginPath(); ctx.moveTo(p[0], p[1]);
        if (p.length === 6) ctx.quadraticCurveTo(p[2], p[3], p[4], p[5]);
        else ctx.bezierCurveTo(p[2], p[3], p[4], p[5], p[6], p[7]);
        ctx.stroke();
    }
    ctx.restore();
}
// Mały lok — zakręcony łuk wewnątrz kółka
function curl(x, y, r, a0) {
    ctx.beginPath(); ctx.arc(x, y, r * 0.5, a0, a0 + 4.2);
    ctx.strokeStyle = 'rgba(240,240,248,0.32)'; ctx.lineWidth = lw(0.8); ctx.stroke();
}
function hairTie(x, y, w, h, rot, st) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
    rrect(-w / 2, -h / 2, w, h, Math.min(w, h) / 2); shape(st.accent, null);
    ctx.restore();
}
const sway = (st, t, k = 1) => Math.sin(t * 2.4 + (st.seed || 0) * 1.7) * k;
// Chmura loków: najpierw grube obrysy, potem wypełnienie — zostaje jeden wspólny kontur
function curlCloud(circles, fill, stroke, w = 1.2, marks = true) {
    ctx.strokeStyle = stroke; ctx.lineWidth = lw(w) * 2;
    for (const [x, y, r] of circles) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke(); }
    ctx.fillStyle = fill;
    for (const [x, y, r] of circles) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }
    if (!marks) return;
    ctx.strokeStyle = 'rgba(240,240,248,0.26)'; ctx.lineWidth = lw(0.7);
    circles.forEach(([x, y, r], i) => {
        if (i % 2) return;
        ctx.beginPath(); ctx.arc(x + r * 0.1, y - r * 0.1, r * 0.42, i, i + 3.6); ctx.stroke();
    });
}
const ring = (cx, cy, R, a0, a1, n, r0, r1) => Array.from({ length: n }, (_, i) => {
    const a = a0 + (a1 - a0) * i / (n - 1);
    return [cx + Math.cos(a) * R, cy + Math.sin(a) * R, i % 2 ? r0 : r1];
});

/* ─── Fryzury z profilu (twarz w stronę +x, środek głowy 0,0, r = 13) ─── */
function hairBack(st, t) {
    const h = st.hair, s = sway(st, t, 1.6);
    ctx.save(); ctx.lineJoin = 'round';
    if (h === 'long') {
        ctx.beginPath();
        ctx.moveTo(-3, 14);
        ctx.bezierCurveTo(-13, 13, -17, 4, -17, -8);
        ctx.bezierCurveTo(-17, -18, -16 + s * 0.5, -25, -17 + s, -32);
        ctx.quadraticCurveTo(-12 + s, -30, -9 + s, -33);
        ctx.quadraticCurveTo(-8 + s * 0.8, -28, -5 + s * 0.6, -29);
        ctx.bezierCurveTo(-6, -20, -4, -11, 1, -3);
        ctx.closePath(); hairFill(st);
        strands([[-8, 11, -15, 2, -15, -14, -14 + s, -29], [-5, 7, -11, -2, -10, -16, -9 + s, -30], [-12, 7, -16, -5, -16, -18, -16 + s, -30]]);
    } else if (h === 'ponytail') {
        const p = sway(st, t * 1.3, 3.2);
        ctx.beginPath();
        ctx.moveTo(-11, 11);
        ctx.bezierCurveTo(-20, 10, -24 + p * 0.3, -2, -21 + p, -16);
        ctx.quadraticCurveTo(-20 + p, -24, -15 + p, -25);
        ctx.quadraticCurveTo(-17 + p * 0.7, -18, -16 + p * 0.5, -10);
        ctx.bezierCurveTo(-15, -2, -13, 3, -9, 6);
        ctx.closePath(); hairFill(st);
        strands([[-13, 8, -19, 2, -20, -10, -18 + p, -21], [-11, 7, -16, 0, -17, -10, -16 + p, -19]]);
    } else if (h === 'curly') {
        curlCloud(ring(-1, 1, 14, 2.3, 4.3, 7, 4, 4.8), hairCol(st), C.line, 1.2);
    }
    ctx.restore();
}

function hairTop(st, t) {
    const h = st.hair;
    ctx.save(); ctx.lineJoin = 'round';
    if (h === 'cap') {
        // włosy spod czapki i baczek
        ctx.beginPath(); ctx.moveTo(-12, 5); ctx.quadraticCurveTo(-17, -1, -13, -8); ctx.quadraticCurveTo(-11, -3, -7, 1); ctx.closePath(); hairFill(st, 1.2);
        strands([[-12, 3, -14, -2, -13, -6]], 0.3, 0.7);
        ctx.beginPath(); ctx.moveTo(-0.5, 5); ctx.lineTo(3, 5.5); ctx.lineTo(2.4, -1.5); ctx.lineTo(0.3, -1); ctx.closePath(); hairFill(st, 0.9);
        // korona, szwy, guzik, opaska, regulacja
        ctx.beginPath(); ctx.moveTo(12, 4.5);
        ctx.bezierCurveTo(13, 14, 5, 19.5, -2, 19);
        ctx.bezierCurveTo(-10, 18.5, -15, 12, -14, 4);
        ctx.closePath(); shape('#0f0f1a', C.line, 1.5);
        strands([[-1.5, 19, 4, 15, 5, 9, 4, 4.5], [-1.5, 19, -7, 15, -9, 9, -8, 4.5]], 0.35, 0.8);
        ctx.beginPath(); ctx.arc(-1.5, 19.4, 1.5, 0, TAU); shape(st.accent, null);
        line([[-14, 5.5], [12, 5.5]], st.accent, 1.5);
        ctx.beginPath(); ctx.arc(-11.5, 8.5, 2.2, 0, TAU); ctx.strokeStyle = 'rgba(240,240,248,0.35)'; ctx.lineWidth = lw(0.8); ctx.stroke();
        // daszek
        ctx.beginPath(); ctx.moveTo(10.5, 5.2); ctx.quadraticCurveTo(19, 6.8, 25, 2.6); ctx.lineTo(24, 1.2); ctx.quadraticCurveTo(17, 2.6, 10, 3); ctx.closePath();
        shape('#0f0f1a', C.line, 1.4);
        line([[12, 3.4], [22, 2.2]], 'rgba(240,240,248,0.25)', 0.7);
        ctx.restore(); return;
    }
    if (h === 'curly') {
        curlCloud([...ring(0, 1.5, 12.6, 0.6, 3.7, 12, 3.6, 4.4), ...ring(0, 2, 16.2, 0.95, 3.1, 7, 3.4, 4)], hairCol(st), C.line, 1.2);
        ctx.restore(); return;
    }
    ctx.beginPath();
    if (h === 'quiff') {
        // uniesiona, zaczesana do tyłu grzywka + wygolone boki
        ctx.moveTo(11, 6);
        ctx.bezierCurveTo(12.5, 11, 16.5, 16, 15, 21);
        ctx.bezierCurveTo(10, 24, 1, 22.5, -6, 19);
        ctx.bezierCurveTo(-12.5, 16, -15, 9, -14.2, 2);
        ctx.bezierCurveTo(-14, -4, -12, -8.5, -9, -10.5);
        ctx.bezierCurveTo(-8, -3, -4, 3, 1, 5);
        ctx.bezierCurveTo(4, 6.5, 8, 6.5, 11, 6);
        hairFill(st);
        strands([[14, 20, 7, 21.5, -1, 19.5, -8, 15.5], [11.5, 14.5, 5, 17, -3, 16, -11, 10.5], [9, 9, 3, 12, -5, 11.5, -12.5, 4]]);
        strands([[-11, -2, -9, 0.5, -6.5, 2.5], [-12, 2, -10, 3.5, -7.5, 5.5], [-12.5, 6, -10.5, 7, -8, 8.5]], 0.18, 0.7);
        ctx.beginPath(); ctx.moveTo(1, 5); ctx.lineTo(3.2, 5.6); ctx.lineTo(2.6, -1.5); ctx.lineTo(0.8, -1); ctx.closePath(); hairFill(st, 0.9);
    } else if (h === 'spiky') {

function shade(hex, k) {
    const n = parseInt(hex.slice(1), 16);
    let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
    if (k <= 1) { r *= k; g *= k; b *= k; }
    else { const m = k - 1; r += (255 - r) * m; g += (255 - g) * m; b += (255 - b) * m; }
    return '#' + [r, g, b].map(v => Math.round(clamp(v, 0, 255)).toString(16).padStart(2, '0')).join('');
}

function band(a, b, k, w, col, width = 1) {
    const p = lerpP(a, b, k), n = perp(a, b);

}
// Zegarek na nadgarstku (bohater) — tarcza świeci w rytm ekranu

    ctx.fillStyle = `rgba(96,165,250,${0.55 + 0.45 * Math.max(G.light, G.verdict)})`; ctx.fillRect(-1.6, -2.2, 3.2, 4.4);
    ctx.restore();
}

// IK z łokciem zawsze na zewnątrz sylwetki

    const p = ik(a, b, l1, l2, 1), q = ik(a, b, l1, l2, -1);

/* ─── Fryzury od przodu (środek głowy 0,0, r = 15, oczy na y ≈ 2) ─── */
function frontHairBack(st, t) {
    const h = st.hair, s = sway(st, t, 1.4);
    ctx.save(); ctx.lineJoin = 'round';
    if (h === 'long') {
        // dwa pasma opadające na ramiona — szyja zostaje odsłonięta
        for (const d of [-1, 1]) {
            ctx.beginPath();
            ctx.moveTo(d * 9, 12);
            ctx.bezierCurveTo(d * 19, 11, d * 20.5, -2, d * 19.5, -12);
            ctx.bezierCurveTo(d * 19 + s, -18, d * 20.5 + s, -24, d * 19 + s, -29);
            ctx.quadraticCurveTo(d * 16.5 + s, -26, d * 15 + s, -29.5);
            ctx.quadraticCurveTo(d * 13 + s * 0.8, -26, d * 11.5 + s * 0.6, -25);
            ctx.bezierCurveTo(d * 13, -16, d * 13.5, -6, d * 11, 2);
            ctx.closePath(); hairFill(st);
            strands([[d * 14, 8, d * 17, -2, d * 17, -14, d * 17 + s, -26], [d * 12, 2, d * 15, -8, d * 14.5, -17, d * 14 + s, -26]]);
        }
    } else if (h === 'bob') {
        for (const d of [-1, 1]) {
            ctx.beginPath();
            ctx.moveTo(d * 10, 12);
            ctx.bezierCurveTo(d * 18.5, 11, d * 19, 0, d * 18.5, -8);
            ctx.bezierCurveTo(d * 18, -12, d * 15, -14.5, d * 11.5, -13.5);
            ctx.quadraticCurveTo(d * 10, -12, d * 11.5, -9);
            ctx.bezierCurveTo(d * 13, -3, d * 13, 3, d * 11, 6);
            ctx.closePath(); hairFill(st);
            strands([[d * 15, 6, d * 17, -1, d * 16.5, -7, d * 14.5, -11.5]]);
        }
    } else if (h === 'ponytail') {
        // wysoki kucyk wystaje zza głowy i buja się w rytm
        const p = sway(st, t * 1.3, 2.5);
        ctx.beginPath();
        ctx.moveTo(8, 17);
        ctx.bezierCurveTo(19, 18, 23 + p, 8, 21 + p, -4);
        ctx.quadraticCurveTo(20 + p, -12, 16 + p, -14);
        ctx.quadraticCurveTo(18 + p * 0.6, -4, 14, 6);
        ctx.closePath(); hairFill(st);
        strands([[11, 15, 18, 13, 20 + p, 4, 18 + p, -8]]);

        curlCloud([...ring(0, 2, 17, -0.4, Math.PI + 0.4, 13, 4.8, 5.8), ...ring(0, 3, 21, 0.3, Math.PI - 0.3, 8, 4.4, 5.2)], hairCol(st), C.line, 1.2);
    }
    ctx.restore();
}

function frontHairTop(st, t) {
    const h = st.hair;
    ctx.save(); ctx.lineJoin = 'round';
    if (h === 'cap') {
        // włosy spod czapki po bokach
        for (const d of [-1, 1]) {
            ctx.beginPath(); ctx.moveTo(d * 15.5, 6); ctx.quadraticCurveTo(d * 17.5, 0, d * 15, -5); ctx.quadraticCurveTo(d * 14, -1, d * 13.5, 4); ctx.closePath(); hairFill(st, 1);
        }
        // korona z panelami, guzik i logo z globem
        ctx.beginPath(); ctx.moveTo(-16, 7); ctx.bezierCurveTo(-16.5, 17, -9, 23, 0, 23); ctx.bezierCurveTo(9, 23, 16.5, 17, 16, 7); ctx.closePath();
        shape('#0f0f1a', C.line, 1.5);
        strands([[-8, 21, -11, 16, -12, 11, -12, 8], [8, 21, 11, 16, 12, 11, 12, 8]], 0.3, 0.8);
        ctx.beginPath(); ctx.arc(0, 23.3, 1.6, 0, TAU); shape(st.accent, null);
        ctx.strokeStyle = st.accent; ctx.lineWidth = lw(1);
        ctx.beginPath(); ctx.arc(0, 15, 3.8, 0, TAU); ctx.stroke();
        ctx.beginPath(); ctx.ellipse(0, 15, 1.6, 3.8, 0, 0, TAU); ctx.stroke();
        line([[-3.8, 15], [3.8, 15]], st.accent, 0.8);
        line([[-16, 8.5], [16, 8.5]], st.accent, 1.4);
        // daszek (nad oczami)
        ctx.beginPath(); ctx.ellipse(0, 7.6, 19, 3.9, 0, 0, TAU); shape('#0f0f1a', C.line, 1.4);
        ctx.beginPath(); ctx.ellipse(0, 7.6, 14.5, 2.2, 0, Math.PI + 0.15, TAU - 0.15);
        ctx.strokeStyle = 'rgba(240,240,248,0.3)'; ctx.lineWidth = lw(0.8); ctx.stroke();
        ctx.restore(); return;
    }
    if (h === 'curly') {
        curlCloud(ring(0, 3.5, 14, 0.3, Math.PI - 0.3, 11, 3.6, 4.3), hairCol(st), C.line, 1.1);
        ctx.restore(); return;
    }
    ctx.beginPath();
    if (h === 'quiff') {
        // uniesiona grzywka przechylona na bok + wygolone boki
        ctx.moveTo(-15.6, 2);
        ctx.bezierCurveTo(-16.8, 12, -12, 19, -5, 21.5);
        ctx.bezierCurveTo(-1, 25.5, 6, 27, 11, 24);
        ctx.bezierCurveTo(15, 21, 17, 13, 15.6, 2);
        ctx.bezierCurveTo(14, 8, 10, 11.5, 5, 11.5);
        ctx.bezierCurveTo(1, 11.5, -2, 13, -5, 12);
        ctx.bezierCurveTo(-10, 11, -13, 8, -15.6, 2);
        hairFill(st);
        strands([[-9, 17, -5, 21, 2, 24, 9, 23.5], [-5, 14, -1, 18, 5, 21, 12, 20], [0, 12.5, 4, 15, 9, 16.5, 14, 14]]);
        strands([[-15.4, 6, -14.2, 7.5, -13.2, 9], [15.4, 6, 14.2, 7.5, 13.2, 9]], 0.18, 0.7);
    } else if (h === 'spiky') {
        const P = [[-15.6, 1.5], [-18.5, 12], [-13.5, 16], [-15, 24], [-8, 19], [-5, 28], [0, 20.5], [5, 28.5], [8, 19.5], [14.5, 24.5], [13.5, 16], [18.5, 12], [15.6, 1.5],
                   [12.5, 8], [9.5, 5.5], [7, 10.5], [3, 7], [0, 11], [-3, 7], [-7, 10.5], [-9.5, 5.5], [-12.5, 8]];
        ctx.moveTo(P[0][0], P[0][1]);
        for (const p of P.slice(1)) ctx.lineTo(p[0], p[1]);
        ctx.closePath(); hairFill(st);
        strands([[-13.5, 21, -11, 17, -9, 14], [-5, 25, -4, 19, -3, 15], [5, 25.5, 4, 19.5, 3, 15], [13, 21.5, 11, 17.5, 9, 14], [-16, 10, -13, 9.5, -11, 11], [16, 10, 13, 9.5, 11, 11]]);
    } else if (h === 'bob') {
        // prosta grzywka z ząbkami
        ctx.moveTo(-16, 2);
        ctx.bezierCurveTo(-17, 13, -10, 20, 0, 20);
        ctx.bezierCurveTo(10, 20, 17, 13, 16, 2);
        ctx.quadraticCurveTo(14, 6, 12.5, 6.5);
        ctx.quadraticCurveTo(10, 9, 7.5, 7.5); ctx.quadraticCurveTo(5, 9.5, 2.5, 8);
        ctx.quadraticCurveTo(0, 9.8, -2.5, 8); ctx.quadraticCurveTo(-5, 9.5, -7.5, 7.5);
        ctx.quadraticCurveTo(-10, 9, -12.5, 6.5); ctx.quadraticCurveTo(-14, 6, -16, 2);
        hairFill(st);
        strands([[0, 19.5, 1, 14, 2.5, 8.5], [-6, 18.5, -6, 13, -7.5, 8], [6, 18.5, 6.5, 13, 7.5, 8], [-11, 16, -12, 11, -12.5, 7], [11, 16, 12, 11, 12.5, 7]]);
    } else if (h === 'long' || h === 'ponytail' || h === 'bun') {
        const part = h === 'long' ? 3.5 : 0;      // długie: przedziałek z boku
        ctx.moveTo(-15.6, 1);
        ctx.bezierCurveTo(-16.5, 14, -8, 20, 0, 20);
        ctx.bezierCurveTo(8, 20, 16.5, 14, 15.6, 1);
        ctx.bezierCurveTo(14, 7, 10, 11, part + 1, 13.5);
        ctx.lineTo(part, 15.5);
        ctx.lineTo(part - 1, 13.5);
        ctx.bezierCurveTo(-10, 11, -14, 7, -15.6, 1);
        hairFill(st);
        if (h === 'long') strands([[part, 15.5, -5, 16, -11, 12, -14.5, 4], [part, 15.5, -3, 13.5, -8, 11, -12, 6], [part, 15.5, 8, 16, 12.5, 12, 14.5, 4], [part, 15.5, 7, 13.5, 10, 11, 12.5, 6]]);
        else strands([[-12, 6, -10, 12, -5, 16, 0, 19.5], [-7, 11, -4, 14, -2, 17, 0, 19.5], [12, 6, 10, 12, 5, 16, 0, 19.5], [7, 11, 4, 14, 2, 17, 0, 19.5]]);
        if (h === 'bun') {
            ctx.beginPath(); ctx.arc(0, 25.5, 7.5, 0, TAU); hairFill(st, 1.3);
            ctx.strokeStyle = 'rgba(240,240,248,0.32)'; ctx.lineWidth = lw(0.8);
            ctx.beginPath(); ctx.arc(0, 25.5, 4.6, 0.3, 3.7); ctx.stroke();
            ctx.beginPath(); ctx.arc(1, 25, 2.2, 3.4, 7.4); ctx.stroke();
            hairTie(0, 18.8, 9, 2.6, 0, st);
            strands([[-14.5, 6, -16, 0, -15, -6], [14.5, 6, 16, 0, 15, -6]], 0.35, 0.9);
        }
    } else {
        ctx.moveTo(-15.6, 1);
        ctx.bezierCurveTo(-16.5, 15, -8, 19.5, 0, 19);
        ctx.bezierCurveTo(8, 19.5, 16.5, 15, 15.6, 1);
        ctx.bezierCurveTo(12, 9, 5, 10, -1, 7.5);
        ctx.bezierCurveTo(-7, 10, -12, 7, -15.6, 1);
        hairFill(st);
        strands([[-10, 15, -4, 18, 3, 18, 9, 15]]);
    }
    ctx.restore();
}


function printFront(st, y, t) {
    const p = st.print;
    if (p === 'logo') {
        ctx.beginPath(); ctx.arc(0, y, 10, 0, TAU); shape('#0d1426', 'rgba(240,240,248,0.5)', 0.9);
        globe(0, y, 9, t * 1.2, 0.95, 0.7, true);
        sparkle(12, y + 10, 3.2, 'rgba(240,240,248,0.9)');
    } else if (p === 'stripe') {
        line([[-18.5, y + 3], [18.5, y + 3]], st.accent, 2.4);
        line([[-18.8, y - 2], [18.8, y - 2]], 'rgba(240,240,248,0.85)', 1.4);
    } else if (p === 'star') sparkle(0, y, 6, 'rgba(240,240,248,0.92)');
    else if (p === 'cpp' || p === 'braces' || p === 'code') {
        text(p === 'cpp' ? 'C++' : p === 'braces' ? '{ }' : '</>', 0, y - 3.5, '800 10px Syne', 'rgba(240,240,248,0.92)');
    }
}

// f: { x, y, st, bounce, hands: [lewa, prawa] (w układzie postaci), elbows?, mouth, medal, tilt, trophy? }
function drawFront(f, t) {
    const st = f.st, near = C.line;
    const hood = st.hood, skin = st.skin, pants = st.pants, shoeC = st.shoe;
    ctx.save();
    ctx.translate(f.x, f.y);
    const hy = FB.hip + f.bounce;
    // Nogi: spodnie ze szwem, buty z białą podeszwą i sznurówkami
    for (const side of [-1, 1]) {
        const hp = [side * 9, hy], an = [side * 12, 6];
        const [kn, a] = ikOut(hp, an, 46, 46, side);
        limb(hp, kn, a, 14, near, pants, true);
        line([[side * 3.5, hy - 6], [kn[0] - side * 4.5, kn[1]], [a[0] - side * 4.5, 12]], 'rgba(0,0,0,0.3)', 0.8);
        const sx = a[0] + side * 3;
        rrect(sx - 8, 2.5, 16, 8.5, 4); shape(shoeC, near, 1.3);
        rrect(sx - 8.5, 0, 17, 3.6, 1.8); shape('#f4f4f8', near, 1.1);
        const lace = isLight(shoeC) ? 'rgba(30,30,40,0.55)' : 'rgba(240,240,248,0.75)';
        for (let k = 0; k < 3; k++) line([[sx - 2.6, 5.4 + k * 1.7], [sx + 2.6, 5.4 + k * 1.7]], lace, 0.7);
    }
    // Kaptur za szyją (z ciemniejszym wnętrzem)
    ctx.beginPath(); ctx.ellipse(0, hy + FB.torso + 4, 15, 6, 0, 0, TAU); shape(shade(hood, 0.72), near, 1.5);
    ctx.beginPath(); ctx.ellipse(0, hy + FB.torso + 4.6, 10, 3.2, 0, 0, TAU); shape(shade(hood, 0.42), null);
    // Tułów — bluza
    const body = new Path2D();
    body.moveTo(-17, hy - 6); body.lineTo(17, hy - 6);
    body.quadraticCurveTo(20, hy + 20, 21, hy + FB.torso - 4);
    body.quadraticCurveTo(18, hy + FB.torso + 3, 7, hy + FB.torso + 4);
    body.lineTo(-7, hy + FB.torso + 4);
    body.quadraticCurveTo(-18, hy + FB.torso + 3, -21, hy + FB.torso - 4);
    body.quadraticCurveTo(-20, hy + 20, -17, hy - 6);
    ctx.fillStyle = hood; ctx.fill(body);
    ctx.save(); ctx.clip(body);
    ctx.fillStyle = 'rgba(0,0,0,0.16)'; ctx.fillRect(11, hy - 8, 14, 70);           // cień z boku
    ctx.fillStyle = shade(hood, 0.72); ctx.fillRect(-24, hy - 8, 48, 7.5);           // ściągacz
    ctx.restore();
    ctx.strokeStyle = near; ctx.lineWidth = lw(1.8); ctx.stroke(body);
    line([[-17.5, hy - 0.5], [17.5, hy - 0.5]], 'rgba(240,240,248,0.35)', 0.9);
    for (let x = -15; x <= 15; x += 3) line([[x, hy - 5.5], [x, hy - 1.5]], 'rgba(0,0,0,0.25)', 0.6);
    // kieszeń kangurka
    ctx.beginPath(); ctx.moveTo(-10, hy + 2); ctx.lineTo(10, hy + 2); ctx.lineTo(7, hy + 16); ctx.lineTo(-7, hy + 16); ctx.closePath();
    shape(shade(hood, 0.86), 'rgba(240,240,248,0.45)', 0.9);
    // zamek
    if (st.zip) {
        ctx.save(); ctx.setLineDash([lw(1.2), lw(1)]);
        line([[0, hy - 5], [0, hy + FB.torso + 3]], 'rgba(240,240,248,0.75)', 1);
        ctx.restore();
        rrect(-1.2, hy + FB.torso - 6, 2.4, 4, 0.8); shape('#cfd3dc', null);
    }
    // Wstążka medalu, nadruk, sznurki, medal
    if (f.medal) {
        line([[-8, hy + FB.torso + 3], [0, hy + 12]], 'rgba(59,130,246,0.95)', 2.2);
        line([[8, hy + FB.torso + 3], [0, hy + 12]], 'rgba(240,240,248,0.95)', 2.2);
    }
    if (st.zip && st.print !== 'logo') { ctx.save(); ctx.translate(-9.5, hy + 38); ctx.scale(0.5, 0.5); printFront(st, 0, t); ctx.restore(); }
    else printFront(st, hy + 32, t);
    for (const s of [-1, 1]) {
        line([[s * 4, hy + FB.torso + 2], [s * 5, hy + FB.torso - 12]], 'rgba(240,240,248,0.9)', 0.9);
        ctx.beginPath(); ctx.arc(s * 5, hy + FB.torso - 12.8, 1, 0, TAU); ctx.fillStyle = '#cfd3dc'; ctx.fill();
    }
    if (f.medal) {
        ctx.beginPath(); ctx.arc(0, hy + 9, 6.5, 0, TAU); shape('#15120a', MEDAL[f.medal], 2);
        sparkle(0, hy + 9, 3.4 + 1.2 * beatPulse(t), MEDAL[f.medal]);
    }
    // Szyja i słuchawki na szyi
    // Słuchawki na szyi: pałąk za karkiem (szyja go zasłania), muszle na obojczykach
    const n = hy + FB.torso, pc = st.phonesCol || '#262a36';
    if (st.phones) {
        ctx.beginPath(); ctx.moveTo(-12.5, n + 7); ctx.quadraticCurveTo(0, n + 17, 12.5, n + 7);
        ctx.lineCap = 'round';
        ctx.strokeStyle = near; ctx.lineWidth = 3.2 + lw(1.2) * 2; ctx.stroke();
        ctx.strokeStyle = pc; ctx.lineWidth = 3.2; ctx.stroke();
    }
    ctx.beginPath(); ctx.rect(-5, n + 2, 10, 9); shape(shade(skin, 0.85), near, 1.3);
    if (st.phones) {
        for (const s of [-1, 1]) {
            ctx.save(); ctx.translate(s * 12.5, n + 5.5); ctx.rotate(s * 0.45);
            ctx.beginPath(); ctx.ellipse(0, 0, 5.4, 7, 0, 0, TAU); shape(pc, near, 1.4);
            ctx.beginPath(); ctx.ellipse(0, 0, 3.4, 4.8, 0, 0, TAU); shape(shade(pc, 0.7), null);   // poduszka
            ctx.beginPath(); ctx.arc(0, 0, 1.6, 0, TAU); shape(shade(pc, 1.3), null);
            if (s > 0) { ctx.beginPath(); ctx.arc(2.6, -4.2, 0.8, 0, TAU); ctx.fillStyle = st.accent; ctx.fill(); }
            ctx.restore();
        }
    }
    // Głowa
    ctx.save();
    ctx.translate(0, hy + FB.torso + 11 + FB.head);
    ctx.rotate(f.tilt || 0);
    frontHairBack(st, t);
    if (st.hair !== 'long' && st.hair !== 'bob') {
        for (const s of [-1, 1]) {
            ctx.beginPath(); ctx.ellipse(s * 15, 0.5, 3.2, 4.4, 0, 0, TAU); shape(skin, near, 1.2);
            ctx.beginPath(); ctx.ellipse(s * 15.4, 0.5, 1.3, 2.3, 0, 0, TAU); ctx.fillStyle = shade(skin, 0.75); ctx.fill();
        }
    }
    ctx.beginPath(); ctx.arc(0, 0, FB.head, 0, TAU); shape(skin, near, 1.8);
    frontHairTop(st, t);
    for (const s of [-1, 1]) { ctx.beginPath(); ctx.ellipse(s * 8.8, -3.2, 3, 1.8, 0, 0, TAU); ctx.fillStyle = 'rgba(232,110,110,0.28)'; ctx.fill(); }
    for (const s of [-1, 1]) {
        ctx.beginPath(); ctx.ellipse(s * 6, 2.2, 2.3, 1.8, 0, 0, TAU); ctx.fillStyle = '#f6f6fa'; ctx.fill();
        ctx.beginPath(); ctx.arc(s * 6, 2.1, 1.25, 0, TAU); ctx.fillStyle = '#1a1a22'; ctx.fill();
        ctx.beginPath(); ctx.arc(s * 6 + 0.45, 2.55, 0.4, 0, TAU); ctx.fillStyle = '#fff'; ctx.fill();
    }
    ctx.beginPath(); ctx.moveTo(0.4, 0.8); ctx.quadraticCurveTo(2, -2.4, -0.6, -2.9);
    ctx.strokeStyle = shade(skin, 0.6); ctx.lineWidth = lw(1); ctx.stroke();                 // nos
    if (st.glasses) {
        for (const s of [-1, 1]) { rrect(s * 6 - 4.5, -1, 9, 6.5, 2); shape('rgba(170,200,255,0.16)', st.glassCol, 1.4); }
        line([[-1.5, 3], [1.5, 3]], st.glassCol, 1.1);
    }
    if (st.hair !== 'cap') for (const s of [-1, 1]) line([[s * 3, 8.5], [s * 9, 9.5]], hairCol(st), 1.5);
    if (f.mouth === 'open') {
        const oh = 3.8 + 0.8 * beatPulse(t);
        ctx.beginPath(); ctx.ellipse(0, -6.5, 4.8, oh, 0, 0, TAU); shape('#5a1f2a', near, 1.3);
        ctx.save(); ctx.beginPath(); ctx.ellipse(0, -6.5, 4.8, oh, 0, 0, TAU); ctx.clip();
        ctx.fillStyle = '#f4f4f8'; ctx.fillRect(-5, -6.5 + oh - 1.6, 10, 1.6);                  // zęby
        ctx.beginPath(); ctx.ellipse(0, -6.5 - oh + 1.2, 3, 1.8, 0, 0, TAU); ctx.fillStyle = '#d0566b'; ctx.fill();  // język
        ctx.restore();
    } else {
        ctx.beginPath(); ctx.arc(0, -2, 6, Math.PI * 1.15, Math.PI * 1.85);
        ctx.strokeStyle = shade(skin, 0.45); ctx.lineWidth = lw(1.5); ctx.stroke();
    }
    ctx.restore();
    // Trofeum (za dłońmi)
    if (f.trophy) drawTrophy(f.trophy[0], f.trophy[1], t);
    // Ręce: rękawy, mankiety, dłonie
    for (const [i, side] of [[0, -1], [1, 1]]) {
        const sh = [side * 20, hy + FB.torso - 3];
        const [el, hd] = f.elbows ? [f.elbows[i], f.hands[i]] : ikOut(sh, f.hands[i], FB.upper, FB.fore, side);
        limb(sh, el, hd, 11, near, hood);
        band(el, hd, 0.84, 11, 'rgba(240,240,248,0.45)', 0.9);
        ctx.beginPath(); ctx.arc(hd[0], hd[1], 5.5, 0, TAU); shape(skin, near, 1.4);
    }
    ctx.restore();
}

function drawTrophy(cx, by, t) {
    const gold = C.gold;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(cx, by + 45, 0, cx, by + 45, 90);
    g.addColorStop(0, `rgba(232,193,112,${0.28 + 0.2 * beatPulse(t)})`); g.addColorStop(1, 'rgba(232,193,112,0)');
    ctx.fillStyle = g; ctx.fillRect(cx - 100, by - 50, 200, 200);
    ctx.restore();
    rrect(cx - 16, by, 32, 7, 2); shape('#1a1408', gold, 1.6);
    rrect(cx - 11, by + 7, 22, 11, 2); shape('#1a1408', gold, 1.4);
    text('OI', cx, by + 9.5, '800 7px Syne', 'rgba(232,193,112,0.95)');
    ctx.beginPath(); ctx.rect(cx - 3, by + 18, 6, 12); shape('#1a1408', gold, 1.3);
    for (const s of [-1, 1]) {
        ctx.beginPath(); ctx.arc(cx + s * 22, by + 52, 8, s > 0 ? -Math.PI / 2 : Math.PI / 2, s > 0 ? Math.PI / 2 : Math.PI * 1.5, false);
        ctx.strokeStyle = gold; ctx.lineWidth = lw(2.4); ctx.stroke();
    }
    ctx.beginPath();
    ctx.moveTo(cx - 5, by + 30);
    ctx.bezierCurveTo(cx - 18, by + 36, cx - 22, by + 50, cx - 23, by + 66);
    ctx.lineTo(cx + 23, by + 66);
    ctx.bezierCurveTo(cx + 22, by + 50, cx + 18, by + 36, cx + 5, by + 30);
    ctx.closePath();
    shape('#211a0a', gold, 2);
    line([[cx - 23, by + 66], [cx + 23, by + 66]], 'rgba(255,240,200,0.9)', 2.4);
    ctx.beginPath(); ctx.moveTo(cx - 14, by + 60); ctx.quadraticCurveTo(cx - 14, by + 44, cx - 7, by + 37);
    ctx.strokeStyle = 'rgba(255,240,200,0.55)'; ctx.lineWidth = lw(1.6); ctx.stroke();
    sparkle(cx + 3, by + 50, 7 + 3 * beatPulse(t), 'rgba(255,240,200,0.95)');
}

/* ─── Kibic z tyłu (pod światło sceny — ciemne, ale kolorowe) ─── */
function drawFan(x, jump, handL, handR, kind, phone, t, id, flag = false) {
    ctx.save();
    ctx.translate(x, jump);
    const rim = 'rgba(96,165,250,0.45)', fine = 'rgba(96,165,250,0.26)';
    const hood = pick(HOODIES, id * 5.3), hairC = pick(HAIR_COLS, id * 6.1), skin = pick(SKINS, id * 8.9);
    const bodyF = shade(hood, 0.34), skinF = shade(skin, 0.3), hairF = shade(hairC, 0.55);
    const fineLines = list => { ctx.strokeStyle = fine; ctx.lineWidth = lw(0.8); for (const p of list) { ctx.beginPath(); ctx.moveTo(p[0], p[1]); ctx.quadraticCurveTo(p[2], p[3], p[4], p[5]); ctx.stroke(); } };
    const s = Math.sin(t * 2.6 + id) * 2.5;
    for (const [hand, side] of [[handL, -1], [handR, 1]]) {
        const sh = [side * 20, 147];
        const [el, hd] = ikOut(sh, hand, 34, 32, side);
        limb(sh, el, hd, 11, rim, bodyF);
        band(el, hd, 0.84, 11, 'rgba(96,165,250,0.3)', 0.8);
        ctx.beginPath(); ctx.arc(hd[0], hd[1], 5.5, 0, TAU); shape(skinF, rim, 1.2);
        if (phone && side === 1) { rrect(hd[0] - 4.5, hd[1] + 2, 9, 15, 2); shape('rgba(225,238,255,0.95)', null); }
        if (flag && side === -1) handFlag(hd, t, id);
    }
    // plecy bluzy z kapturem
    ctx.beginPath();
    ctx.moveTo(-24, 60); ctx.lineTo(-22, 138); ctx.quadraticCurveTo(-21, 152, -8, 154); ctx.lineTo(8, 154);
    ctx.quadraticCurveTo(21, 152, 22, 138); ctx.lineTo(24, 60); ctx.closePath();
    shape(bodyF, rim, 1.6);
    ctx.beginPath(); ctx.moveTo(-13, 152); ctx.quadraticCurveTo(-15, 132, 0, 128); ctx.quadraticCurveTo(15, 132, 13, 152);
    shape(shade(hood, 0.26), fine, 1);                                            // kaptur na plecach
    ctx.beginPath(); ctx.rect(-6, 150, 12, 12); shape(skinF, null);
    ctx.lineJoin = 'round';
    // włosy za głową (długie, bob, kucyk)
    if (kind === 'long') {
        ctx.beginPath(); ctx.moveTo(-15, 178);
        ctx.bezierCurveTo(-19, 160, -18 + s * 0.4, 146, -17 + s, 134);
        ctx.quadraticCurveTo(-9 + s, 129, -1 + s, 133); ctx.quadraticCurveTo(8 + s, 128, 17 + s, 134);
        ctx.bezierCurveTo(18 + s * 0.4, 146, 19, 160, 15, 178); ctx.closePath();
        shape(hairF, rim, 1.2);

    } else if (kind === 'bob') {

    } else if (kind === 'ponytail') {

        for (const [px, py] of [[-17, 188], [-10, 186], [-9, 197], [-3, 189], [1, 200], [5, 189], [10, 197], [11, 186], [17, 188], [15, 178]]) ctx.lineTo(px, py);

const CROWD = [
    { s: 1.2, lift: -178, fans: Array.from({ length: 22 }, (_, i) => ({ x: -880 + i * 82 + hash(i * 3.3) * 30, id: i })) },
    { s: 1.6, lift: -340, fans: Array.from({ length: 16 }, (_, i) => ({ x: -780 + i * 104 + hash(i * 7.7) * 40, id: i + 50 })) }
];
const FAN_KIND = ['quiff', 'long', 'bun', 'cap', 'curly', 'spiky', 'ponytail', 'bob'];
function drawCrowd(t, row) {
    ctx.save();
    layer(row.s, row.lift);
    const hv = halfView() / row.s + 120;
    for (const f of row.fans) {
        if (Math.abs(f.x - cam.x) > hv) continue;
        const h = hash(f.id * 1.7), style = Math.floor(h * 4);
        const off = hash(f.id * 5.1) * 0.25;
        const ph = style === 0 ? barPhase(t + off) * 2 % 1 : beatPhase(t + off * 0.3);
        const jump = (10 + hash(f.id) * 10) * Math.pow(Math.sin(Math.PI * ph), 1.6);
        const wave = Math.sin((t + off) * Math.PI * 1.5) * 16;
        let hl, hr;
        if (style === 1) { hl = [-26 + wave, 212]; hr = [26 + wave, 212]; }            // ręce w górę, bujanie
        else if (style === 2) { hl = [-30, 200 + 12 * Math.sin(t * 9 + f.id)]; hr = [30, 200 + 12 * Math.sin(t * 9 + f.id + 2)]; }
        else { hl = [-34, 206]; hr = [34, 206]; }                                         // skaczą z rękami w V
        drawFan(f.x, jump, hl, hr, FAN_KIND[Math.floor(hash(f.id * 2.7) * FAN_KIND.length)], hash(f.id * 9.3) > 0.72, t, f.id, hash(f.id * 4.4) > 0.8 && hash(f.id * 9.3) <= 0.72);
    }
    ctx.restore();
}

const CONFETTI = Array.from({ length: 170 }, (_, i) => ({
    x: -700 + hash(i * 1.1) * 1400, y0: 450 + hash(i * 2.2) * 420, v: 55 + hash(i * 3.3) * 60,
    sw: 8 + hash(i * 4.4) * 22, rs: 2 + hash(i * 5.5) * 6, ph: hash(i * 6.6) * TAU,
    col: ['#f0f0f8', '#60a5fa', '#e8c170', '#3b82f6', '#f0f0f8'][i % 5]

function drawConfetti(t, from, to, scale) {
    const dt = t - T.podium;
    if (dt < 0) return;
    for (let i = from; i < to; i++) {
        const c = CONFETTI[i];
        let y = c.y0 - dt * c.v - Math.max(0, 0.6 - dt) * 200;
        y = ((y + 120) % 800 + 800) % 800 - 120;
        const x = c.x + Math.sin(dt * 1.7 + c.ph) * c.sw;
        const r = dt * c.rs + c.ph;
        ctx.save();
        ctx.translate(x, y); ctx.rotate(r); ctx.scale(Math.cos(dt * c.rs * 1.3 + c.ph), 1);
        ctx.fillStyle = c.col; ctx.fillRect(-2 * scale, -3.5 * scale, 4 * scale, 7 * scale);
        ctx.restore();

}

/* ─── Scena: kratownica z reflektorami, ekrany LED, kolumny, zimne ognie, dym ─── */
const TRUSS_Y = 386;
const FIXTURES = [-520, -340, -190, 190, 340, 520];
function drawTruss(t) {
    const c = 'rgba(200,205,220,0.55)', c2 = 'rgba(200,205,220,0.28)';
    const zig = (x0, y0, x1, y1, n, dx, dy) => {
        ctx.beginPath();
        for (let k = 0; k < n; k++) {
            const a = k / n, b = (k + 1) / n;
            ctx.moveTo(lerp(x0, x1, a) + (k % 2 ? dx : 0), lerp(y0, y1, a) + (k % 2 ? dy : 0));
            ctx.lineTo(lerp(x0, x1, b) + (k % 2 ? 0 : dx), lerp(y0, y1, b) + (k % 2 ? 0 : dy));
        }
        ctx.strokeStyle = c2; ctx.lineWidth = lw(1); ctx.stroke();
    };
    line([[-760, TRUSS_Y], [760, TRUSS_Y]], c, 1.6);
    line([[-760, TRUSS_Y + 16], [760, TRUSS_Y + 16]], c, 1.6);
    zig(-760, TRUSS_Y, 760, TRUSS_Y, 95, 0, 16);
    for (const X of [-776, 760]) {
        line([[X, 0], [X, TRUSS_Y + 16]], c, 1.6);
        line([[X + 16, 0], [X + 16, TRUSS_Y + 16]], c, 1.6);
        zig(X, 0, X, TRUSS_Y + 16, 25, 16, 0);
    }
    FIXTURES.forEach((x, i) => {
        line([[x, TRUSS_Y], [x, TRUSS_Y - 6]], c, 1.4);
        rrect(x - 8, TRUSS_Y - 22, 16, 16, 3); shape('#15161f', C.lineMid, 1.1);
        const on = 0.45 + 0.55 * beatPulse(t + i * 0.09, 6);
        ctx.beginPath(); ctx.arc(x, TRUSS_Y - 23, 4.5, 0, TAU);
        ctx.fillStyle = `rgba(${i % 2 ? '96,165,250' : '240,240,248'},${on})`; ctx.fill();
    });
}
// Tekst dopasowany do szerokości (zmniejsza się, gdy się nie mieści)
function fitText(str, x, y, font, color, maxW) {
    ctx.save();
    ctx.font = font;
    const k = Math.min(1, maxW / ctx.measureText(str).width);
    ctx.translate(x, y); ctx.scale(k, -k);
    ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(str, 0, 0);
    ctx.restore();
}
// Ekran LED podwieszony na linkach pod kratownicą
function drawSideScreen(cx, t) {
    const w = 136, h = 96, x0 = cx - w / 2, y0 = 200, pad = 10;
    for (const lx of [x0 + 18, x0 + w - 18]) line([[lx, y0 + h + 6], [lx, TRUSS_Y]], 'rgba(200,205,220,0.45)', 1.2);
    // napisy wypadają w szerokich ujęciach, korektor podczas najazdów kamery
    const mode = [1, 2, 0][Math.floor(Math.max(0, t - T.podium) / (BAR * 2)) % 3];
    const tint = mode === 1 ? '232,193,112' : mode === 2 ? '52,211,153' : '96,165,250';
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    glow(cx, y0 + h / 2, 120, tint, 0.1 + 0.06 * beatPulse(t));
    ctx.restore();
    rrect(x0 - 6, y0 - 6, w + 12, h + 12, 4); shape('#0b0b12', C.lineMid, 1.6);
    ctx.save(); ctx.beginPath(); ctx.rect(x0, y0, w, h); ctx.clip();
    ctx.fillStyle = '#050814'; ctx.fillRect(x0, y0, w, h);
    if (mode === 0) {                                                        // korektor w rytm
        const bi = Math.floor((t - B0) / BEAT), n = 11, bw = (w - 2 * pad) / n;
        for (let i = 0; i < n; i++) {
            const hh = (0.25 + 0.75 * hash(i * 3.1 + bi)) * (h - 2 * pad) * (0.45 + 0.55 * beatPulse(t, 5));
            ctx.fillStyle = i % 3 ? 'rgba(96,165,250,0.95)' : 'rgba(232,193,112,0.95)';
            ctx.fillRect(x0 + pad + i * bw + 1.5, y0 + pad, bw - 3, hh);
        }
    } else if (mode === 1) {
        fitText('1. MIEJSCE', cx, y0 + 58, '800 26px Syne', '#f3cf7f', w - 2 * pad);
        fitText('t-olimpian', cx, y0 + 26, '700 16px "JetBrains Mono"', '#ffffff', w - 2 * pad);
    } else {
        fitText('100/100', cx, y0 + 58, '800 34px Syne', '#4ade80', w - 2 * pad);
        fitText('ZAAKCEPTOWANO', cx, y0 + 26, '700 13px "JetBrains Mono"', '#ffffff', w - 2 * pad);
    }
    ctx.fillStyle = 'rgba(0,0,0,0.14)';
    for (let y = y0; y < y0 + h; y += 3) ctx.fillRect(x0, y, w, 0.8);          // piksele LED
    ctx.restore();
}
function drawSpeakerStack(cx, t) {
    const p = 1 + 0.09 * beatPulse(t, 8);
    for (let k = 0; k < 2; k++) {
        const y0 = k * 62;

        ctx.beginPath(); ctx.arc(cx, y0 + 34, 18 * p, 0, TAU); shape('#07070b', C.lineMid, 1.2);
        ctx.beginPath(); ctx.arc(cx, y0 + 34, 7 * p, 0, TAU); shape('#1b1d27', C.lineDim, 1);
        ctx.beginPath(); ctx.arc(cx, y0 + 9, 4, 0, TAU); shape('#07070b', C.lineDim, 0.9);
    }
}
// Zimne ognie: na drop i na początku kolejnych fraz
function drawSparklers(t) {
    let start = -1;
    for (const s of [T.podium, T.pullBack, T.sweep, T.title]) if (t >= s && t < s + 1.8) start = s;
    if (start < 0) return;
    const age = t - start, fade = 1 - smooth(1.2, 1.8, age);
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (const X of [-240, -200, 200, 240]) {
        const bg = ctx.createRadialGradient(X, 6, 0, X, 6, 60);
        bg.addColorStop(0, `rgba(255,210,140,${0.35 * fade})`); bg.addColorStop(1, 'rgba(255,210,140,0)');
        ctx.fillStyle = bg; ctx.fillRect(X - 60, -54, 120, 120);
        for (let i = 0; i < 26; i++) {
            const life = 0.7 + hash(i * 1.3 + X) * 0.4;
            const a = ((age + hash(i * 7.7 + X) * life) % life) / life, tt = a * life;
            const x = X + (hash(i * 3.3 + X) - 0.5) * 70 * tt, y = (260 + hash(i * 5.1 + X) * 140) * tt - 300 * tt * tt;
            if (y < 0) continue;
            ctx.fillStyle = `rgba(255,${200 + (i % 3) * 20},150,${(1 - a) * fade})`;
            ctx.beginPath(); ctx.arc(x, y, 1.4 + (1 - a) * 1.4, 0, TAU); ctx.fill();
        }
    }
    ctx.restore();
}
function drawHaze(t) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 6; i++) {
        const x = -750 + i * 300 + Math.sin(t * 0.3 + i * 1.7) * 70;
        ctx.save(); ctx.translate(x, 18); ctx.scale(1, 0.28);
        const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 230);
        g.addColorStop(0, 'rgba(150,180,255,0.08)'); g.addColorStop(1, 'rgba(150,180,255,0)');
        ctx.fillStyle = g; ctx.fillRect(-230, -230, 460, 460);
        ctx.restore();
    }
    ctx.restore();
}
// Biało-czerwona flaga w dłoni kibica
function handFlag(hd, t, id) {
    const top = [hd[0] + 4, hd[1] + 50];
    line([hd, top], 'rgba(220,220,230,0.8)', 1.4);
    const wv = k => Math.sin(t * 7 + id + k * 2.2) * 3 * k;
    const stripe = (y0, y1, col) => {
        ctx.beginPath();
        for (let k = 0; k <= 4; k++) ctx[k ? 'lineTo' : 'moveTo'](top[0] + k * 8, top[1] - y0 + wv(k / 4));
        for (let k = 4; k >= 0; k--) ctx.lineTo(top[0] + k * 8, top[1] - y1 + wv(k / 4));
        ctx.closePath(); ctx.fillStyle = col; ctx.fill();
    };
    stripe(0, 10, '#c9ccd6');
    stripe(10, 20, '#b3202a');
}

function drawSpotlights(t) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const I = 0.7 + 0.55 * barPulse(t, 4) + 0.25 * beatPulse(t, 9);
    [[-520, 0.35, '96,165,250'], [-190, 0.12, '240,240,248'], [190, -0.12, '240,240,248'], [520, -0.35, '96,165,250']].forEach(([x, base, col], i) => {
        const a = base + 0.28 * Math.sin(t * 1.15 + i * 1.9);
        const ax = x, ay = TRUSS_Y - 23, len = 470;
        const ex = ax + Math.sin(a) * len, ey = ay - Math.cos(a) * len;
        const nx = Math.cos(a) * 70, ny = Math.sin(a) * 70;
        const g = ctx.createLinearGradient(ax, ay, ex, ey);
        g.addColorStop(0, `rgba(${col},${0.2 * I})`); g.addColorStop(1, `rgba(${col},0.015)`);
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.moveTo(ax - 4, ay); ctx.lineTo(ax + 4, ay); ctx.lineTo(ex + nx, ey + ny); ctx.lineTo(ex - nx, ey - ny); ctx.closePath(); ctx.fill();
        const pg = ctx.createRadialGradient(ex, 0, 0, ex, 0, 90);
        pg.addColorStop(0, `rgba(${col},${0.12 * I})`); pg.addColorStop(1, `rgba(${col},0)`);
        ctx.fillStyle = pg; ctx.save(); ctx.translate(ex, 0); ctx.scale(1, 0.25); ctx.beginPath(); ctx.arc(0, 0, 90, 0, TAU); ctx.restore(); ctx.fill();
    });
    ctx.restore();
}

function podiumBlock(x0, x1, h, num, col) {
    ctx.beginPath(); ctx.rect(x0, 0, x1 - x0, h); shape('#0d0d16', C.line, 2);
    line([[x0, h], [x1, h]], col, 2.6);
