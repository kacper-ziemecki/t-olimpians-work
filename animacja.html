function drawPodiumScene(t) {
    const dt = t - T.podium;
    // Tło: ściana LED z wielkim globem z logo
    const bgG = ctx.createRadialGradient(0, 260, 20, 0, 260, 700);
    bgG.addColorStop(0, '#101630'); bgG.addColorStop(0.5, '#0a0c18'); bgG.addColorStop(1, '#050508');
    ctx.fillStyle = bgG; ctx.fillRect(-3000, -1000, 6000, 3000);
    for (let x = -900; x <= 900; x += 60) line([[x, 0], [x, 700]], 'rgba(96,165,250,0.05)', 1);
    for (let y = 30; y <= 700; y += 60) line([[-900, y], [900, y]], 'rgba(96,165,250,0.05)', 1);
    const gA = 0.55 + 0.35 * barPulse(t, 4);
    globe(0, 300, 175, t * 0.35, gA, 2.2);
    sparkle(250, 450, 34 * (0.85 + 0.3 * barPulse(t)), 'rgba(240,240,248,0.85)');
    sparkle(300, 400, 15 * (0.85 + 0.3 * beatPulse(t)), 'rgba(240,240,248,0.75)');
    drawSideScreen(-335, t);
    drawSideScreen(335, t);
    drawSpeakerStack(-290, t);
    drawSpeakerStack(290, t);
    drawTruss(t);
    drawSpotlights(t);
    drawConfetti(t, 0, 110, 1);

    // Poświata za zwycięzcą
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const hg = ctx.createRadialGradient(0, 210, 0, 0, 210, 260);
    hg.addColorStop(0, `rgba(232,193,112,${0.16 + 0.1 * beatPulse(t)})`); hg.addColorStop(1, 'rgba(232,193,112,0)');
    ctx.fillStyle = hg; ctx.fillRect(-300, -60, 600, 560);
    ctx.restore();

    // Scena i podium
    ctx.fillStyle = '#08080d'; ctx.fillRect(-3000, -40, 6000, 40);
    line([[-3000, 0], [3000, 0]], C.line, 2);
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    line([[-3000, -6], [3000, -6]], `rgba(96,165,250,${0.5 + 0.5 * beatPulse(t)})`, 2.2);
    ctx.restore();
    podiumBlock(-158, -52, 48, '2', MEDAL.silver);
    podiumBlock(52, 158, 34, '3', MEDAL.bronze);
    podiumBlock(-52, 52, 70, '1', MEDAL.gold);
    drawSparklers(t);

    // Srebro i brąz klaszczą w rytm
    // Oklaski przed klatką piersiową: dłonie spotykają się dokładnie na bicie
    const open = Math.pow(Math.sin(Math.PI * beatPhase(t)), 0.8);
    const bounce = -4 * beatPulse(t, 8);
    const clapY = FB.hip + bounce;
    const cw = 4.5 + 13 * open, handY = clapY + 33 + 4 * open;
    const clapHands = [[-cw, handY], [cw, handY + 1]];
    const clapElbows = [[-26 - 2 * open, clapY + 19], [26 + 2 * open, clapY + 19]];
    for (const [x, y, st, medal, tilt] of [[-105, 48, SILVER_STYLE, 'silver', 0.06], [105, 34, BRONZE_STYLE, 'bronze', -0.06]]) {
        drawFront({ x, y, st, bounce, medal, tilt: tilt * Math.sin(t * 2), mouth: 'open', hands: clapHands, elbows: clapElbows }, t);
    }
    // Zwycięzca — puchar nad głowę na „raz”, potem pompowanie na każdą „raz” taktu
    const up = easeBack(T.trophyUp, T.trophyUp + 0.45, t);
    const pump = 7 * barPulse(t, 6) * up;
    const hb = -2 * beatPulse(t, 8);
    const lowT = [0, 86 + hb], highT = [0, 202 + pump + hb];
    const tro = lerpP(lowT, highT, up);
    const hands = up > 0.01
        ? [[tro[0] - lerp(26, 12, up), tro[1] + lerp(52, 6, up)], [tro[0] + lerp(26, 12, up), tro[1] + lerp(52, 6, up)]]
        : [[-26, 138 + hb], [26, 138 + hb]];
    drawFront({ x: 0, y: 70, st: HERO_STYLE, bounce: hb, medal: 'gold', tilt: 0.04 * Math.sin(t * 1.6) - 0.05 * up, mouth: up > 0.5 ? 'open' : 'smile', hands, trophy: tro }, t);
    // Iskry wokół pucharu na kolejnych bitach
    const bi = Math.floor((t - B0) / BEAT);
    for (let i = 0; i < 6; i++) {
        if (bi % 6 !== i) continue;
        const a = i / 6 * TAU + 0.4;
        sparkle(Math.cos(a) * 95, 290 + Math.sin(a) * 60, 16 * beatPulse(t, 6), 'rgba(255,240,200,0.95)');
    }
    drawConfetti(t, 110, 170, 1.3);
    drawHaze(t);
    CROWD.forEach(row => drawCrowd(t, row));
    // Wybuch na drop
    if (dt < 1.2) {
        ctx.save(); ctx.globalCompositeOperation = 'lighter';
        const r = easeOut(0, 1.2, dt) * 900;
        ctx.beginPath(); ctx.arc(0, 200, r, 0, TAU);
        ctx.strokeStyle = `rgba(200,225,255,${0.6 * (1 - dt / 1.2)})`; ctx.lineWidth = lw(10 * (1 - dt / 1.2) + 1); ctx.stroke();
        ctx.restore();
    }
}

/* ════════════════════════════════════════════════════════════
   KAMERA — ujęcia, cięcia na „raz” taktu, pulsowanie w rytm
   ════════════════════════════════════════════════════════════ */
const mixCam = (a, b, k) => ({ x: lerp(a.x, b.x, k), y: lerp(a.y, b.y, k), z: lerp(a.z, b.z, k) });
const chairX = t => CHAIR_X + easeIO(T.scootStart, T.scootEnd, t) * 14;
const inBar = (t, n) => t >= bar(n) && t < bar(n + 1);

function hallCam(t) {
    const e = easeIO(1.8, T.walkStart + 0.4, t);
    const establish = { x: lerp(-560, -380, e), y: lerp(230, 165, e), z: lerp(1.55, 1.2, e) };
    const track = { x: walkX(t) + 110, y: 150, z: 1.2 };
    let c = mixCam(establish, track, smooth(T.walkStart, T.walkStart + 1.6, t));
    c = mixCam(c, { x: 212, y: 104, z: 1.8 }, easeIO(bar(9) - 0.8, bar(10) + 0.3, t));
    c = mixCam(c, { x: 250, y: 118, z: 2.3 }, easeIO(bar(10) + 0.4, bar(11) + 0.2, t));
    const sc = clamp(t - bar(12), 0, 3);
    c = mixCam(c, { x: 292 + sc * 1.5, y: 129, z: 4.0 + sc * 0.04 }, easeIO(bar(11) + 0.3, bar(12) + 0.05, t));
    let u;
    if (inBar(t, 6)) {                                   // stopy stawiane w rytm
        u = (t - bar(6)) / BAR;
        c = { x: walkX(t) + 25, y: 42, z: 3.1 };
    } else if (inBar(t, 14)) {                           // montaż: rywale przy klawiaturach
        u = (t - bar(14)) / BAR;
        c = { x: -380 + u * 30, y: 150, z: 2.55 + u * 0.1 };
    } else if (inBar(t, 15)) {                           // ranking i zegar na ścianie
        u = (t - bar(15)) / BAR;
        c = { x: -170 + u * 20, y: 272, z: 1.7 + u * 0.12 };
    } else if (inBar(t, 16)) {                           // twarz bohatera w świetle ekranu
        u = (t - bar(16)) / BAR;
        c = { x: 200 + u * 6, y: 121, z: 3.3 + u * 0.3 };
    } else if (t >= bar(17)) {                           // wysłanie, przerwa, testy — powolny najazd
        u = easeIO(bar(17), T.verdict, t);
        c = { x: lerp(305, 325, u), y: lerp(130, 133, u), z: lerp(3.7, 4.7, u) };
        if (t > T.verdict) c.z *= 1 + 0.12 * Math.exp(-(t - T.verdict) * 5);
    }
    c.z *= 1 + 0.012 * energy(t) * barPulse(t, 6);
    const hh = 1.4 / c.z;
    c.x += (Math.sin(t * 0.71) * 1.2 + Math.sin(t * 1.93 + 1) * 0.5) * hh;
    c.y += (Math.sin(t * 0.87 + 2) * 0.9 + Math.sin(t * 2.31) * 0.4) * hh;
    if (t > T.judgeStart && t < T.verdict) {            // narastające drżenie w ciszy
        const k = smooth(T.judgeStart, T.verdict, t) * 0.5 / c.z;
        c.x += Math.sin(t * 37) * k; c.y += Math.sin(t * 41 + 1) * k;
    }
    return c;
}
function dofAmount(t) {
    if (inBar(t, 14) || inBar(t, 15)) return 0;
    return clamp((cam.z - 2.1) * 2.2, 0, 5);
}

function podiumCam(t) {
    const d = t - T.podium;
    // od pierwszej klatki kamera płynie: najazd z szerokiego planu na zwycięzcę, na starcie najszybciej
    const push = 1 - Math.pow(1 - clamp(d / (T.pullBack - T.podium - 0.05), 0, 1), 2);
    let c = mixCam({ x: 0, y: 182, z: 0.95 }, { x: 0, y: 212, z: 1.5 }, push);
    c.z *= 1 + 0.12 * Math.exp(-d * 6);                // uderzenie na drop
    if (t >= T.pullBack) {
        const u = easeOut(T.pullBack, T.pullBack + 0.5, t);
        c = { x: 0, y: lerp(240, 215, u), z: lerp(1.5, 1.0, u) + clamp(t - T.pullBack, 0, 4) * 0.012 };
    }
    let sweepEnd = null;
    if (t >= T.sweep) {
        const u = easeIO(T.sweep, T.title, t);
        c = { x: lerp(-250, 250, u), y: lerp(165, 190, u), z: 1.75 - 0.15 * Math.sin(Math.PI * u) };
        sweepEnd = { x: 250, y: 190, z: 1.75 };
    }
    if (t >= T.title) c = mixCam(sweepEnd, { x: 0, y: 190, z: 0.92 - clamp(t - T.title - 1.6, 0, 12) * 0.006 }, easeIO(T.title, T.title + 1.8, t));
    c.z *= 1 + 0.03 * barPulse(t, 7) + 0.008 * beatPulse(t, 10);
    const hh = 2.2 / c.z;
    c.x += (Math.sin(t * 1.1) * 1.4 + Math.sin(t * 2.7 + 1) * 0.6) * hh;
    c.y += (Math.sin(t * 1.3 + 2) * 1.1 + Math.sin(t * 3.1) * 0.5) * hh;
    return c;
}

/* ════════════════════════════════════════════════════════════
   ŚWIATŁO W SALI
   ════════════════════════════════════════════════════════════ */
const rgb = c => `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;
const mix3 = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)];
function glow(x, y, r, col, a) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(${col},${a})`); g.addColorStop(0.45, `rgba(${col},${a * 0.3})`); g.addColorStop(1, `rgba(${col},0)`);
    ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
}
function drawHallLighting(t) {
    const L = G.light;
    ctx.save();
    ctx.globalCompositeOperation = 'multiply';
    const amb = [160, 165, 206], lit = mix3(amb, [238, 245, 255], L);
    const g = ctx.createRadialGradient(MON.x - 30, MON.y - 10, 8, MON.x - 30, MON.y - 10, 520);
    g.addColorStop(0, rgb(lit.map(v => Math.min(v, 226)))); g.addColorStop(0.3, rgb(mix3(lit, amb, 0.45))); g.addColorStop(1, rgb(amb));
    ctx.fillStyle = g; ctx.fillRect(-4000, -1000, 8000, 2400);
    ctx.restore();
    drawHallLamps();
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    // snopy światła z lamp
    for (const X of HALL_LAMPS) {
        const x = layerX(X, 0.7);
        glow(x, 350, 70, '200,215,255', 0.22);
        const sg = ctx.createLinearGradient(0, 350, 0, 0);
        sg.addColorStop(0, 'rgba(170,195,255,0.07)'); sg.addColorStop(1, 'rgba(170,195,255,0.008)');
        ctx.fillStyle = sg;
        ctx.beginPath(); ctx.moveTo(x - 44, 350); ctx.lineTo(x + 44, 350); ctx.lineTo(x + 130, 0); ctx.lineTo(x - 130, 0); ctx.closePath(); ctx.fill();
    }
    for (const [x, y, s] of GLOWS) glow(x, y, 130 * s, '96,150,255', 0.16);
    glow(NEIGHBOR.x - CHAIR_X + MON.x, MON.y, 170, '96,150,255', 0.16);
    if (L > 0) {
        const c = mix3([59, 130, 246], [52, 211, 153], G.verdict * 0.85);
        const zk = 1 / Math.max(1, cam.z / 1.8);
        glow(MON.x, MON.y, 300, `${c[0] | 0},${c[1] | 0},${c[2] | 0}`, 0.3 * L * zk);
        glow(MON.x - 30, DESK.top, 90, '120,170,255', 0.16 * L);
    }
    ctx.restore();
}

function renderHall(t) {
    const P = heroPose(t);
    HERO_KEYS = [{ x: P.keyN, p: P.pressN * P.kb }, { x: P.keyF, p: P.pressF * P.kbF }];
    // Tło w niższej rozdzielczości
    ctx = bgCtx;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, bgCvs.width, bgCvs.height);
    setWorld(BG_RES);
    drawWall(t);
    drawFloorFar();
    drawRows(t);
    ctx = main;
    setScreen();
    const blur = dofAmount(t);
    if (blur > 0.3) ctx.filter = `blur(${blur.toFixed(1)}px)`;
    ctx.drawImage(bgCvs, 0, 0, W, H);
    ctx.filter = 'none';
    setWorld();
    // Odbicie w podłodze
    ctx.save();
    ctx.beginPath(); ctx.rect(-4000, -700, 8000, 700); ctx.clip();
    ctx.scale(1, -1); ctx.globalAlpha = 0.08;
    drawChair(chairX(t)); drawHeroStation(t);
    ctx.restore();
    const ff = ctx.createLinearGradient(0, 0, 0, -60);
    ff.addColorStop(0, 'rgba(6,6,10,0.1)'); ff.addColorStop(1, 'rgba(6,6,10,0.95)');
    ctx.fillStyle = ff; ctx.fillRect(-4000, -700, 8000, 700);
    line([[-4000, 0], [4000, 0]], C.lineMid, 1.6);
    // Pierwszy rząd
    drawStandee(-800, t);
    drawStation(NEIGHBOR, t, true);
    drawChair(chairX(t));
    drawHeroStation(t);
    drawCharacter(P, t);
    drawHallLighting(t);
}

/* ════════════════════════════════════════════════════════════
   EFEKTY FILMOWE (ekran)
   ════════════════════════════════════════════════════════════ */
const grainCvs = document.createElement('canvas');
grainCvs.width = grainCvs.height = 256;
(() => {
    const g = grainCvs.getContext('2d'), img = g.createImageData(256, 256);
    for (let i = 0; i < img.data.length; i += 4) {
        const v = Math.random() * 255;
        img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
        img.data[i + 3] = 60 + Math.random() * 100;
    }
    g.putImageData(img, 0, 0);
})();
let grainPattern = null;

function flare(x, y, I, col) {
    if (I < 0.01) return;
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const hg = ctx.createLinearGradient(0, 0, W, 0), cx = clamp(x / W, 0.05, 0.95);
    hg.addColorStop(0, `rgba(${col},0)`); hg.addColorStop(cx, `rgba(${col},${0.75 * I})`); hg.addColorStop(1, `rgba(${col},0)`);
    ctx.fillStyle = hg; ctx.fillRect(0, y - 1.5, W, 3);
    ctx.globalAlpha = 0.35; ctx.fillRect(0, y - 10, W, 20); ctx.globalAlpha = 1;
    const rg = ctx.createRadialGradient(x, y, 0, x, y, Math.max(W, H) * 0.6);
    rg.addColorStop(0, `rgba(${col},${0.35 * I})`); rg.addColorStop(1, `rgba(${col},0)`);
    ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);
    ctx.restore();
}

function drawPost(t, podium) {
    setScreen();
    const S = BASE * cam.z;
    if (!podium) {
        flare(W / 2 + (MON.x - cam.x) * S, H / 2 - (MON.y - cam.y) * S, G.flash, G.verdict > 0.3 ? '110,231,183' : '120,170,255');
    } else {
        const d = t - T.podium;
        const I = 0.3 * barPulse(t, 6) + (d < 1.2 ? 0.9 * Math.exp(-d * 3) : 0);
        flare(W / 2 + (0 - cam.x) * S, H / 2 - (255 - cam.y) * S, I, '255,226,170');
        ctx.fillStyle = `rgba(220,230,255,${0.07 * barPulse(t, 9)})`; ctx.fillRect(0, 0, W, H);   // stroboskop na „raz”
    }
    const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, frameH) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.72);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.78)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
    if (!grainPattern) grainPattern = ctx.createPattern(grainCvs, 'repeat');
    ctx.save();
    ctx.globalAlpha = 0.07; ctx.globalCompositeOperation = 'overlay';
    ctx.translate(-Math.random() * 256, -Math.random() * 256);
    ctx.fillStyle = grainPattern; ctx.fillRect(0, 0, W + 256, H + 256);
    ctx.restore();
    const dim = 0.5 * smooth(T.title, T.title + 1.5, t);
    const black = Math.max(1 - smooth(2.4, 4.4, t), smooth(T.end - 2.4, T.end, t) * 0.9, dim);
    if (black > 0) { ctx.fillStyle = `rgba(0,0,0,${black})`; ctx.fillRect(0, 0, W, H); }
    if (G.white > 0.005) { ctx.fillStyle = `rgba(245,248,255,${G.white})`; ctx.fillRect(0, 0, W, H); }
}

/* ════════════════════════════════════════════════════════════
   NAPISY HTML
   ════════════════════════════════════════════════════════════ */
const $intro = document.getElementById('intro'), $cap = document.getElementById('caption'), $title = document.getElementById('titleCard');
function updateOverlays(t) {
    const i = smooth(0.3, 1.1, t) * (1 - smooth(2.1, 2.8, t));
    $intro.style.opacity = i.toFixed(3);
    $intro.style.transform = `scale(${1 + t * 0.012})`;
    $cap.style.opacity = (smooth(bar(3) + 0.3, bar(3) + 1, t) * (1 - smooth(bar(6) - 0.4, bar(6), t))).toFixed(3);
    const a = smooth(T.title, T.title + 1.4, t);
    $title.style.opacity = a.toFixed(3);
    const pulse = 1 + 0.012 * barPulse(t, 6) * a * (1 - smooth(T.fadeOut, T.end, t));
    $title.style.transform = `translateY(${((1 - a) * 16).toFixed(1)}px) scale(${((1.05 - 0.05 * a) * pulse).toFixed(4)})`;
    $title.style.filter = a < 1 ? `blur(${((1 - a) * 10).toFixed(1)}px)` : 'none';
    document.body.classList.toggle('ended', t > T.end);
}

/* ════════════════════════════════════════════════════════════
   RENDER KLATKI
   ════════════════════════════════════════════════════════════ */
function updateGlobals(t) {
    const b = t - T.bootStart;
    const flick = b < 0.5 ? (hash(Math.floor(b * 28)) > 0.35 ? 1 : 0.25) : 1;
    G.light = b > 0 ? smooth(0, 1.1, b) * flick : 0;
    G.screenBright = b > 0 ? (b < 0.5 ? 0.55 + 0.45 * flick : 1) : 0;
    const vd = t - T.verdict;
    G.verdict = vd > 0 ? Math.exp(-vd * 1.1) : 0;
    G.flash = (b > 0 ? Math.exp(-b * 4.5) * 0.9 : 0) + (vd > 0 ? Math.exp(-vd * 3.2) * 0.6 : 0);
    G.white = t < T.podium ? Math.pow(smooth(T.white, T.podium, t), 2) : Math.exp(-(t - T.podium) * 3.2);
}

function render(t) {
    updateGlobals(t);
    const podium = t >= T.podium;
    Object.assign(cam, podium ? podiumCam(t) : hallCam(t));
    ctx = main;
    setScreen();
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    if (podium) { setWorld(); drawPodiumScene(t); }
    else renderHall(t);
    drawPost(t, podium);
    updateOverlays(t);
}

/* ════════════════════════════════════════════════════════════
   PĘTLA I STEROWANIE — zegar = pozycja w utworze
   ════════════════════════════════════════════════════════════ */
let tNow = 0, running = false, paused = false, ended = false, muted = false, lastFrame = 0;
const EMBED = document.documentElement.classList.contains('embed');
let embedDone = false;
// Koniec animacji powitalnej (albo „Pomiń”) — oddajemy stronę główną; `at` = miejsce w utworze
function finishEmbed(at) {
    if (!EMBED || embedDone) return;
    embedDone = true; running = false;
    Music.stop();
    try { if (window.parent && window.parent !== window && typeof window.parent.__onIntroAnimDone === 'function') { window.parent.__onIntroAnimDone(at); return; } } catch (e) {}
    try { window.parent.postMessage({ type: 'tolimp-anim-done', at }, '*'); } catch (e) {}
}
function frame(now) {
    requestAnimationFrame(frame);
    if (EMBED && !running) { lastFrame = now; return; }
    if (window.innerWidth !== W || window.innerHeight !== H || Math.min(window.devicePixelRatio || 1, 2) !== DPR) resize();
    const dt = lastFrame ? Math.min(0.1, (now - lastFrame) / 1000) : 0;
    lastFrame = now;
    if (running && !paused) {
        const mt = Music.time();
        if (mt !== null && !ended) tNow = mt; else tNow += dt;
        if (tNow >= T.end && !ended) { ended = true; Music.stop(); finishEmbed(T.end); }
        Music.setVolume(muted ? 0 : 1 - smooth(T.fadeOut, T.end, tNow));
    }
    render(tNow);
}

function restart(at = 0) {
    tNow = at; paused = false; ended = false;
    document.body.classList.remove('ended');
    if (Music.ready) Music.play(at);
}

// ?t=27.5       → start od tej sekundy (z muzyką, po kliknięciu)
// ?podglad=27.5 → cichy podgląd bez ekranu startowego
const qs = new URLSearchParams(location.search);
const startFrom = clamp(parseFloat(qs.get('t')) || 0, 0, T.end - 1);
const $start = document.getElementById('start'), $play = document.getElementById('playBtn');
const $sound = document.getElementById('soundBtn');
Music.rawP.then(() => {
    $play.disabled = false;
    $play.textContent = startFrom > 0 ? `▶  Odtwórz od ${startFrom.toFixed(1)} s` : '▶  Odtwórz animację';
});
Music.onFail = () => {
    $sound.textContent = 'BRAK MUZYKI';
    document.body.classList.add('show-controls');
};
let starting = false;
async function begin(from) {
    if (starting || running) return;
    starting = true;
    Music.unlock();                                   // synchronicznie, w geście użytkownika
    const $load = document.getElementById('embedLoading');
    const loadTimer = setTimeout(() => $load.classList.add('on'), 500);
    const fonts = Promise.race([
        Promise.all(['800 46px Syne', '400 18px "JetBrains Mono"', '500 15px "JetBrains Mono"', '300 18px "DM Sans"'].map(f => document.fonts.load(f))).catch(() => {}),
        new Promise(r => setTimeout(r, 1500))
    ]);
    const [ok] = await Promise.all([Music.prepare(), fonts]);
    clearTimeout(loadTimer); $load.classList.remove('on');
    if (!ok) $sound.textContent = 'BRAK MUZYKI';
    $start.classList.add('hidden');
    document.body.classList.add('rolling');
    restart(from);
    running = true;
    starting = false;
}
$play.addEventListener('click', () => {
    $play.disabled = true; $play.textContent = 'Przygotowuję…';
    begin(startFrom);
});
// Strona główna uruchamia animację w chwili kliknięcia „Jestem gotowy”
window.__embedStart = () => begin(0);
document.getElementById('skipBtn').addEventListener('click', () => finishEmbed(Math.max(0, tNow)));

$sound.addEventListener('click', () => {
    muted = !muted;
    $sound.textContent = muted ? 'DŹWIĘK: WYŁ' : 'DŹWIĘK: WŁ';
});
document.getElementById('replayBtn').addEventListener('click', () => { Music.unlock(); restart(0); running = true; });

let hideTimer = null;
window.addEventListener('pointermove', () => {
    document.body.classList.add('show-controls');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => document.body.classList.remove('show-controls'), 2200);
});
window.addEventListener('keydown', e => {
    if (e.key === 'm' || e.key === 'M') { $sound.click(); return; }
    if (EMBED && e.key === 'Escape') { finishEmbed(Math.max(0, tNow)); return; }
    if (!running) return;
    if (e.code === 'Space') {
        e.preventDefault();
        paused = !paused;
        if (paused) Music.pause(); else Music.resume();
    }
    else if (e.key === 'r' || e.key === 'R') restart(0);
});
window.addEventListener('resize', resize);
resize();
const seek = parseFloat(qs.get('podglad'));
if (!Number.isNaN(seek)) {
    $start.classList.add('hidden');
    document.body.classList.add('rolling');
    tNow = seek; running = true;
}
window.__anim = { seek(t) { tNow = t; }, pause(p = true) { paused = p; }, get t() { return tNow; } };
try { if (EMBED && window.parent.__introStartPending) begin(0); } catch (e) {}
requestAnimationFrame(frame);

})();
</script>
</body>
</html>
