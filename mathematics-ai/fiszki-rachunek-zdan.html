:root {
  /* Layout: one phone-width column. Round progress on top, the index card fills the middle, grading under the thumb, settings last. */
  --desk: #e8ecec;
  --card: #fefefc;
  --ink: #23373b;
  --muted: #53666a;
  --accent: #b85a0c;
  --rule: #e06b6b;
  --good: #1d7f45;
  --bad: #c2334a;
  --on-accent: #ffffff;
  --ruling: rgba(58, 110, 165, .16);
  --line: color-mix(in srgb, var(--ink) 14%, transparent);
  --shadow: 0 1px 2px rgba(35, 55, 59, .07), 0 14px 30px -10px rgba(35, 55, 59, .24);
  --font-tex: "TeX Main", "Latin Modern Roman", "CMU Serif", "STIX Two Text", "Times New Roman", serif;
  --font-math: "TeX Math", "Latin Modern Math", "STIX Two Math", "Cambria Math", "Times New Roman", serif;
  --font-ui: "Fira Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #11191b;
    --card: #1c272a;
    --ink: #e6eded;
    --muted: #98abae;
    --accent: #f0913a;
    --rule: #b9575c;
    --good: #4fcb85;
    --bad: #ff7b88;
    --on-accent: #1a1206;
    --ruling: rgba(150, 190, 230, .08);
    --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 16px 34px -12px rgba(0, 0, 0, .7);
    color-scheme: dark;
  }
}

  --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 16px 34px -12px rgba(0, 0, 0, .7);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--desk);
  color: var(--ink);
  font: 400 15px/1.45 var(--font-ui);
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; touch-action: manipulation; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }

.app {
  min-height: 100%;
  max-width: 560px;
  margin: 0 auto;
  padding: 16px 16px 14px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 14px;
}

/* Header */
.top { display: grid; gap: 9px; }
h1 { margin: 0; font: 600 19px/1.2 var(--font-ui); letter-spacing: -.005em; text-wrap: balance; }
.strip { display: flex; gap: 2px; height: 5px; }
.strip i { flex: 1; border-radius: 2px; background: var(--line); transition: background-color .25s; }
.strip i.cur { background: var(--accent); }
.strip i.yes { background: var(--good); }
.strip i.no { background: var(--bad); }
.meta { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.meta b { color: var(--ink); font-weight: 600; }

/* The index card */
.stage { position: relative; flex: 1 1 auto; min-height: 310px; max-height: 480px; }
.swipe { position: absolute; inset: 0; perspective: 1600px; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.swipe.enter { animation: card-in .26s cubic-bezier(.2, .8, .2, 1); }
@keyframes card-in { from { transform: translateY(10px) scale(.97); opacity: .3; } }
.card {
  position: absolute;
  inset: 0;
  border-radius: 14px;
  transform-style: preserve-3d;
  transition: transform .5s cubic-bezier(.3, .75, .25, 1);
  cursor: pointer;
}
.card:focus-visible { outline-offset: 4px; }
.card.flipped { transform: rotateY(180deg); }
.face {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  border-radius: 14px;
  background-color: var(--card);
  box-shadow: var(--shadow);
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  overflow: hidden;
}
.front {
  transform: rotateY(0deg);
  background-image:
    linear-gradient(var(--rule), var(--rule)),
    repeating-linear-gradient(to bottom, transparent 0 31px, var(--ruling) 31px 32px);
  background-size: 100% 1.5px, 100% 100%;
  background-position: 0 48px, 0 49.5px;
  background-repeat: no-repeat;
}
.back { transform: rotateY(180deg); }
.face-head {
  flex: none;
  height: 48px;
  padding: 0 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12.5px;
  letter-spacing: .03em;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.face-head .ask { color: var(--accent); font-weight: 500; }
.face-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; padding: 10px 20px 12px; }
.face-inner { margin: auto 0; display: grid; justify-items: center; gap: 16px; text-align: center; }
.face-foot { flex: none; padding: 0 18px 14px; text-align: center; font-size: 12.5px; color: var(--muted); }
.swipe-hint { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.swipe-hint .no { color: var(--bad); }
.swipe-hint .yes { color: var(--good); }

.law { margin: 0; font: 400 clamp(27px, 7.6vw, 34px)/1.15 var(--font-tex); text-wrap: balance; }
.law.sub { font-size: 17px; color: var(--muted); }
.lat { font-style: italic; }
.formulas { display: grid; justify-items: center; gap: 10px; width: 100%; }
.formula { max-width: 100%; font: 400 clamp(20px, 5.9vw, 26px)/1.35 var(--font-tex); }
.formulas.sub .formula { font-size: 17px; color: var(--muted); }
.seg { white-space: nowrap; }
.v { font-family: var(--font-math); font-style: italic; }
/* TeX italic correction: a slanted P, S or B must not crowd the next symbol */
.vP { margin-right: .139em; }
.vS { margin-right: .058em; }
.vB { margin-right: .05em; }
.op { font-family: var(--font-tex); font-style: normal; }
.op.main { color: var(--accent); }
.hint { margin: 0; max-width: 33ch; font-size: 14.5px; line-height: 1.5; color: var(--muted); text-wrap: pretty; }
.hint .v { font-size: 1.1em; line-height: 1; }
.hint .op { font-size: 1.05em; line-height: 1; }

.stamp {
  position: absolute;
  top: 62px;
  z-index: 2;
  padding: 5px 11px 6px;
  border: 2.5px solid currentColor;
  border-radius: 8px;
  font: 600 14px/1 var(--font-ui);
  letter-spacing: .1em;
  text-transform: uppercase;
  background: color-mix(in srgb, var(--card) 88%, transparent);
  opacity: 0;
  pointer-events: none;
}
.stamp-yes { left: 16px; color: var(--good); transform: rotate(-9deg); }
.stamp-no { right: 16px; color: var(--bad); transform: rotate(9deg); }

/* End-of-round summary, shown in place of the card */
.summary {
  position: absolute;
  inset: 0;
  display: none;
  flex-direction: column;
  border-radius: 14px;
  background: var(--card);
  box-shadow: var(--shadow);
  overflow: hidden;
}
body[data-view="summary"] .summary { display: flex; }
/* Take over the grading row's height so the column does not jump */
body[data-view="summary"] .stage { max-height: 546px; }
body[data-view="summary"] .swipe,
body[data-view="summary"] .grade { display: none; }
.sum-scroll {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  padding: 24px 22px 28px;
  -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 28px), transparent);
  mask-image: linear-gradient(to bottom, #000 calc(100% - 28px), transparent);
}
.sum-kicker { margin: 0 0 6px; font-size: 13px; color: var(--muted); }
.sum-title { margin: 0; font: 400 32px/1.1 var(--font-tex); text-wrap: balance; }
.sum-text { margin: 12px 0 0; max-width: 40ch; color: var(--muted); }
.sum-label { margin: 20px 0 2px; font-size: 12px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--bad); }
.sum-list { list-style: none; margin: 0; padding: 0; }
.sum-list li { display: flex; align-items: baseline; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.sum-list .num { min-width: 1.7em; text-align: right; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.sum-list .nm { font: 400 18px/1.3 var(--font-tex); }
.sum-actions { flex: none; display: grid; gap: 8px; padding: 12px 22px 20px; }

/* Controls */
.grade { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn {
  height: 52px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 0 16px;
  border: 1.5px solid transparent;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: transform .12s, background-color .15s, border-color .15s;
}
.btn svg { width: 18px; height: 18px; flex: none; }
.btn:active { transform: scale(.975); }
.btn-no { color: var(--bad); background: color-mix(in srgb, var(--bad) 8%, var(--card)); border-color: color-mix(in srgb, var(--bad) 32%, transparent); }
.btn-yes { color: var(--good); background: color-mix(in srgb, var(--good) 9%, var(--card)); border-color: color-mix(in srgb, var(--good) 35%, transparent); }
.btn-primary { background: var(--accent); color: var(--on-accent); }
.btn-ghost { background: transparent; border-color: var(--line); color: var(--ink); }

.tools { display: flex; justify-content: space-between; gap: 4px; margin-top: -4px; }
.tool {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  height: 38px;
  padding: 0 10px;
  border: 0;
  border-radius: 10px;
  background: transparent;
  color: var(--muted);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
}
.tool svg { width: 17px; height: 17px; flex: none; }
.tool:disabled { opacity: .4; cursor: default; }
.tool.confirm { color: var(--bad); background: color-mix(in srgb, var(--bad) 10%, transparent); }

.settings { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding-top: 12px; border-top: 1px solid var(--line); }
.segctl { display: inline-flex; gap: 2px; padding: 3px; border-radius: 11px; background: var(--line); }
.segctl button {
  height: 32px;
  padding: 0 11px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--muted);
  font-size: 13.5px;
  font-weight: 500;
  white-space: nowrap;
  cursor: pointer;
}
.segctl button[aria-checked="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .14); }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  height: 38px;
  padding: 0 13px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: transparent;
  color: var(--muted);
  font-size: 13.5px;
  font-weight: 500;
  cursor: pointer;
}
.chip svg { width: 16px; height: 16px; flex: none; }
.chip[aria-pressed="true"] { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 50%, transparent); background: color-mix(in srgb, var(--accent) 9%, transparent); }

.kbd { display: none; margin: -4px 0 0; text-align: center; font-size: 12.5px; color: var(--muted); }
kbd {
  display: inline-block;
  min-width: 1.7em;
  padding: 1px 5px;
  border: 1px solid var(--line);
  border-bottom-width: 2px;
  border-radius: 5px;
  background: var(--card);
  color: var(--ink);
  font: 500 11.5px/1.4 var(--font-ui);
  text-align: center;
}
.click-only { display: none; }
@media (hover: hover) and (pointer: fine) {
  .kbd { display: block; }
  .tap-only { display: none; }
  .click-only { display: inline; }
  .btn-no:hover { background: color-mix(in srgb, var(--bad) 14%, var(--card)); }
  .btn-yes:hover { background: color-mix(in srgb, var(--good) 15%, var(--card)); }
  .btn-ghost:hover, .tool:hover:not(:disabled), .chip:hover, .icon-btn:hover { background: var(--line); color: var(--ink); }
  .btn-primary:hover { background: color-mix(in srgb, var(--accent) 88%, var(--ink)); }
}

/* Truth-table sheet */
.backdrop { position: fixed; inset: 0; z-index: 10; background: rgba(9, 16, 18, .5); opacity: 0; transition: opacity .25s; }
.backdrop.open { opacity: 1; }
.sheet {
  position: fixed;
  z-index: 11;
  left: 0;
  right: 0;
  bottom: 0;
  max-width: 560px;
  max-height: 86%;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  background: var(--card);
  border-radius: 18px 18px 0 0;
  box-shadow: 0 -10px 40px rgba(0, 0, 0, .25);
  transform: translateY(100%);
  transition: transform .3s cubic-bezier(.2, .8, .2, 1);
}
.sheet.open { transform: none; }
.sheet-head { flex: none; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 18px 18px 12px; border-bottom: 1px solid var(--line); }
.sheet-head h2 { margin: 0; font: 600 17px/1.25 var(--font-ui); }
.sheet-sub { margin: 3px 0 0; font: 400 17px/1.3 var(--font-tex); color: var(--muted); }
.icon-btn { flex: none; width: 36px; height: 36px; display: grid; place-items: center; border: 0; border-radius: 10px; background: var(--line); color: var(--ink); cursor: pointer; }
.icon-btn svg { width: 18px; height: 18px; }
.sheet-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 0 18px 24px; }
.tt-block { display: grid; gap: 12px; padding: 18px 0 4px; }
.tt-block + .tt-block { border-top: 1px solid var(--line); margin-top: 14px; }
.tt-formula { text-align: center; font: 400 20px/1.35 var(--font-tex); }
.tt-legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 20px; font: 400 16.5px/1.45 var(--font-tex); color: var(--muted); }
.tt-legend .v { color: var(--ink); }
.tt-wrap { overflow-x: auto; }
.tt {
  margin: 0 auto;
  border-collapse: collapse;
  font: 400 17px/1.25 var(--font-tex);
  border-top: 1.5px solid var(--ink);
  border-bottom: 1.5px solid var(--ink);
}
.tt th { padding: 8px 11px 6px; font-weight: 400; white-space: nowrap; border-bottom: 1px solid var(--ink); }
.tt td { padding: 3px 11px; text-align: center; font-variant-numeric: tabular-nums; }
.tt tbody tr:first-child td { padding-top: 7px; }
.tt tbody tr:last-child td { padding-bottom: 7px; }
.tt .gap { padding-right: 24px; }
.tt td.z { color: var(--muted); }
.tt th.m { color: var(--good); }
.tt td.m { color: var(--good); background: color-mix(in srgb, var(--good) 11%, transparent); }
.tt td.m.z { color: var(--bad); background: color-mix(in srgb, var(--bad) 11%, transparent); }
.verdict { margin: 0; text-align: center; font-size: 14px; font-weight: 500; color: var(--good); }
.verdict.bad { color: var(--bad); }

@media (prefers-reduced-motion: reduce) {
  .card, .sheet, .backdrop, .btn, .strip i { transition: none !important; }
  .swipe.enter { animation: none; }
}
</style>

(() => {
'use strict';

// <logic>
const CARDS = [
  { n: 1, name: 'Law of excluded middle', f: ['P ∨ ¬P'], hint: 'Każde zdanie jest prawdziwe albo fałszywe. Trzeciej możliwości nie ma.' },
  { n: 2, name: 'Law of non-contradiction', f: ['¬(P ∧ ¬P)'], hint: 'Zdanie nie może być jednocześnie prawdziwe i fałszywe.' },
  { n: 3, name: 'Double negation', f: ['P ↔ ¬¬P'], hint: 'Dwie negacje się znoszą.' },
  { n: 4, name: 'Identity', f: ['P → P', 'P ↔ P'], hint: 'Każde zdanie wynika z samego siebie i jest sobie równoważne.' },
  { n: 5, name: 'Idempotence', f: ['(P ∧ P) ↔ P', '(P ∨ P) ↔ P'], hint: 'Powtórzenie tego samego zdania w ∧ albo ∨ niczego nie zmienia.' },
  { n: 6, name: 'Commutativity', f: ['(P ∧ Q) ↔ (Q ∧ P)', '(P ∨ Q) ↔ (Q ∨ P)'], hint: 'Kolejność argumentów ∧ i ∨ nie ma znaczenia.' },
  { n: 7, name: 'Associativity', f: ['((P ∧ Q) ∧ R) ↔ (P ∧ (Q ∧ R))', '((P ∨ Q) ∨ R) ↔ (P ∨ (Q ∨ R))'], hint: 'W ciągu samych ∧ (albo samych ∨) nawiasy można przestawiać dowolnie.' },
  { n: 8, name: 'Distributivity', f: ['(P ∧ (Q ∨ R)) ↔ ((P ∧ Q) ∨ (P ∧ R))', '(P ∨ (Q ∧ R)) ↔ ((P ∨ Q) ∧ (P ∨ R))'], hint: 'Jak wymnażanie nawiasów. Działa dla ∧ względem ∨ i dla ∨ względem ∧.' },
  { n: 9, name: 'De Morgan’s laws', f: ['¬(P ∧ Q) ↔ (¬P ∨ ¬Q)', '¬(P ∨ Q) ↔ (¬P ∧ ¬Q)'], hint: 'Negacja wchodzi do nawiasu i zamienia ∧ na ∨ (i odwrotnie).' },
  { n: 10, name: 'Absorption', f: ['(P ∧ (P ∨ Q)) ↔ P', '(P ∨ (P ∧ Q)) ↔ P'], hint: 'Człon z Q zostaje wchłonięty, więc wynik zależy tylko od P.' },
  { n: 11, name: 'Implication as disjunction', f: ['(P → Q) ↔ (¬P ∨ Q)'], hint: 'Implikacja jest fałszywa tylko wtedy, gdy P jest prawdziwe, a Q fałszywe.' },
  { n: 12, name: 'Contrapositive', f: ['(P → Q) ↔ (¬Q → ¬P)'], hint: 'Zamień strony i zaneguj obie. Sama zamiana stron (Q → P) nie jest równoważna.' },
  { n: 13, name: 'Biconditional', f: ['(P ↔ Q) ↔ ((P → Q) ∧ (Q → P))'], hint: 'Równoważność to implikacja w obie strony.' },
  { n: 14, name: 'Exportation', f: ['((P ∧ Q) → R) ↔ (P → (Q → R))'], hint: 'Dwie przesłanki naraz to to samo, co jedna po drugiej. W programowaniu to currying.' },
  { n: 15, name: 'Modus ponens', lat: true, f: ['(P ∧ (P → Q)) → Q'], hint: 'Mamy P i wiemy, że P → Q. Zatem Q.' },
  { n: 16, name: 'Modus tollens', lat: true, f: ['(¬Q ∧ (P → Q)) → ¬P'], hint: 'Gdyby zachodziło P, zachodziłoby Q. Q nie zachodzi, więc P też nie.' },
  { n: 17, name: 'Hypothetical syllogism', f: ['((P → Q) ∧ (Q → R)) → (P → R)'], hint: 'Implikacja jest przechodnia, jak składanie funkcji: z P → Q i Q → R mamy P → R.' },
  { n: 18, name: 'Disjunctive syllogism', f: ['((P ∨ Q) ∧ ¬P) → Q'], hint: 'Zachodzi P lub Q, a P odpada. Zostaje Q.' },
  { n: 19, name: 'Constructive dilemma', f: ['((P → Q) ∧ (R → S) ∧ (P ∨ R)) → (Q ∨ S)'], hint: 'Zachodzi P lub R, a każde z nich prowadzi do swojego wniosku. Zatem Q lub S.' },
  { n: 20, name: 'Simplification', f: ['(P ∧ Q) → P'], hint: 'Z koniunkcji wolno wziąć dowolny z jej członów.' },
  { n: 21, name: 'Addition', f: ['P → (P ∨ Q)'], hint: 'Do prawdziwego zdania wolno dołożyć dowolny człon alternatywy.' },
  { n: 22, name: 'Conjunction introduction', f: ['P → (Q → (P ∧ Q))'], hint: 'Mając P, a potem Q, dostajemy P ∧ Q.' },
  { n: 23, name: 'Ex falso quodlibet', lat: true, f: ['(P ∧ ¬P) → Q'], hint: 'Ze sprzeczności wynika cokolwiek.' },
  { n: 24, name: 'Weakening', f: ['P → (Q → P)'], hint: 'Prawdziwe zdanie wynika z czegokolwiek.' },
  { n: 25, name: 'Peirce’s law', f: ['((P → Q) → P) → P'], hint: 'Jeśli z P → Q wynika P, to P zachodzi. Nie obowiązuje w logice intuicjonistycznej.' },
  { n: 26, name: 'Self-distribution of →', f: ['(P → (Q → R)) → ((P → Q) → (P → R))'], hint: 'Jeśli przy założeniu P z Q wynika R, a z P wynika Q, to z P wynika R.' },
  { n: 27, name: 'Reductio ad absurdum', lat: true, f: ['(P → ¬P) → ¬P'], hint: 'Jeśli z P wynika ¬P, to P musi być fałszywe.' },
  { n: 28, name: 'Consequentia mirabilis', lat: true, f: ['(¬P → P) → P'], hint: 'Jeśli nawet z ¬P wynika P, to P musi być prawdziwe.' },
  { n: 29, name: 'Totality of implication', f: ['(P → Q) ∨ (Q → P)'], hint: 'Gdy Q jest prawdziwe, zachodzi P → Q. Gdy fałszywe, zachodzi Q → P.' },
];

const KIND = { '¬': 'not', '∧': 'and', '∨': 'or', '→': 'imp', '↔': 'iff' };
const GLYPH = { not: '¬', and: '∧', or: '∨', imp: '→', iff: '↔' };

function tokenize(src) {
  const out = [];
  for (let i = 0; i < src.length; i++) {
    const c = src[i];
    if (c === ' ') continue;
    if (/[A-Z]/.test(c)) out.push({ k: 'var', v: c, s: i, e: i + 1 });
    else if (c === '(' || c === ')') out.push({ k: c, s: i, e: i + 1 });
    else if (KIND[c]) out.push({ k: KIND[c], s: i, e: i + 1 });
    else throw new Error(`Nieznany znak "${c}" w ${src}`);
  }
  return out;
}

// Precedence: ¬ > ∧ > ∨ > → (right-assoc) > ↔. Every node keeps its source span:
// s/e without its own outer parentheses, os/oe with them; op is the index of its connective.
function parse(src) {
  const t = tokenize(src);
  let i = 0;
  const peek = (k) => i < t.length && t[i].k === k;
  const bin = (k, a, b, o) => ({ t: k, a, b, op: o.s, s: a.os, e: b.oe, os: a.os, oe: b.oe });
  function iff() { let a = imp(); while (peek('iff')) { const o = t[i++]; a = bin('iff', a, imp(), o); } return a; }
  function imp() { const a = or(); if (peek('imp')) { const o = t[i++]; return bin('imp', a, imp(), o); } return a; }
  function or() { let a = and(); while (peek('or')) { const o = t[i++]; a = bin('or', a, and(), o); } return a; }
  function and() { let a = un(); while (peek('and')) { const o = t[i++]; a = bin('and', a, un(), o); } return a; }
  function un() {
    if (peek('not')) { const o = t[i++]; const a = un(); return { t: 'not', a, op: o.s, s: o.s, e: a.oe, os: o.s, oe: a.oe }; }
    return atom();
  }
  function atom() {
    const tk = t[i++];
    if (!tk) throw new Error(`Urwany wzór: ${src}`);
    if (tk.k === 'var') return { t: 'var', v: tk.v, s: tk.s, e: tk.e, os: tk.s, oe: tk.e };
    if (tk.k === '(') {
      const n = iff();
      if (!peek(')')) throw new Error(`Brak nawiasu zamykającego w ${src}`);
      const cl = t[i++];
      n.os = tk.s;
      n.oe = cl.e;
      return n;
    }
    throw new Error(`Nieoczekiwany symbol w ${src}`);
  }
  const root = iff();
  if (i !== t.length) throw new Error(`Nadmiarowe symbole w ${src}`);
  return root;
}

function evaluate(n, env) {
  switch (n.t) {
    case 'var': return env[n.v];
    case 'not': return !evaluate(n.a, env);
    case 'and': return evaluate(n.a, env) && evaluate(n.b, env);
    case 'or': return evaluate(n.a, env) || evaluate(n.b, env);
    case 'imp': return !evaluate(n.a, env) || evaluate(n.b, env);
    case 'iff': return evaluate(n.a, env) === evaluate(n.b, env);
  }
  throw new Error('Nieznany węzeł');
}

function varsOf(n, acc = new Set()) {
  if (n.t === 'var') acc.add(n.v);
  if (n.a) varsOf(n.a, acc);
  if (n.b) varsOf(n.b, acc);
  return acc;
}

// Rows from all-true down to all-false.
function rowsFor(vars) {
  const rows = [];
  const k = vars.length;
  for (let m = 0; m < (1 << k); m++) {
    const env = {};
    vars.forEach((v, j) => { env[v] = !((m >> (k - 1 - j)) & 1); });
    rows.push(env);
  }
  return rows;
}

function isTautology(src) {
  const ast = parse(src);
  return rowsFor([...varsOf(ast)].sort()).every((env) => evaluate(ast, env));
}

const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ESC[c]);
const OPS_RE = /[¬∧∨→↔]/g;
const opSpan = (m) => `<span class="op">${m}</span>`;
// Formulas and table labels: every capital is a variable, set in math italic.
const mathHtml = (s) => esc(s).replace(/[A-Z]|[¬∧∨→↔]/g, (m) => (/[A-Z]/.test(m) ? `<i class="v v${m}">${m}</i>` : opSpan(m)));
// Polish prose with inline math: a lone P, Q, R or S is a variable.
const proseHtml = (s) => esc(s)
  .replace(/(^|[^A-Za-zÀ-ž])([PQRS])(?![A-Za-zÀ-ž])/g, (_, pre, v) => `${pre}<i class="v v${v}">${v}</i>`)
  .replace(OPS_RE, opSpan);
const nameHtml = (c) => {
  const h = esc(c.name).replace(OPS_RE, opSpan);
  return c.lat ? `<i class="lat">${h}</i>` : h;
};

// Break opportunity only around the main connective, which is also highlighted.
function formulaHtml(src) {
  const n = parse(src);
  if (n.t === 'var') return `<span class="seg">${mathHtml(src)}</span>`;
  if (n.t === 'not') return `<span class="seg"><span class="op main">¬</span>${mathHtml(src.slice(n.op + 1))}</span>`;
  const left = src.slice(0, n.op).trim();
  const right = src.slice(n.op + 1).trim();
  return `<span class="seg">${mathHtml(left)}</span> <span class="seg"><span class="op main">${src[n.op]}</span> ${mathHtml(right)}</span>`;
}

const isLiteral = (n) => n.t === 'var' || (n.t === 'not' && isLiteral(n.a));

function tableHtml(src) {
  const ast = parse(src);
  const vars = [...varsOf(ast)].sort();
  const letters = ['A', 'B'];
  const inner = (n) => src.slice(n.s, n.e);
  const label = (n) => (isLiteral(n) ? inner(n) : letters.shift());
  const cols = [];
  const legend = [];
  const side = (n, lab) => {
    if (n.t !== 'var' && !cols.some((c) => c.label === lab)) cols.push({ label: lab, node: n });
    if (!isLiteral(n)) legend.push([lab, inner(n)]);
  };
  let mainLabel = src;
  if (ast.t === 'not') {
    const la = label(ast.a);
    side(ast.a, la);
    mainLabel = `¬${la}`;
  } else if (ast.t !== 'var') {
    const la = label(ast.a);
    const lb = label(ast.b);
    side(ast.a, la);
    side(ast.b, lb);
    mainLabel = `${la} ${GLYPH[ast.t]} ${lb}`;
  }
  cols.push({ label: mainLabel, node: ast, main: true });

  const rows = rowsFor(vars);
  let all = true;
  const cell = (val, cls) => {
    const k = [cls, val ? '' : 'z'].filter(Boolean).join(' ');
    return `<td${k ? ` class="${k}"` : ''}>${val ? 1 : 0}</td>`;
  };
  let h = '<table class="tt"><thead><tr>';
  vars.forEach((v, j) => { h += `<th scope="col"${j === vars.length - 1 ? ' class="gap"' : ''}>${mathHtml(v)}</th>`; });
  cols.forEach((c) => { h += `<th scope="col"${c.main ? ' class="m"' : ''}>${mathHtml(c.label)}</th>`; });
  h += '</tr></thead><tbody>';
  rows.forEach((env) => {
    h += '<tr>';
    vars.forEach((v, j) => { h += cell(env[v], j === vars.length - 1 ? 'gap' : ''); });
    cols.forEach((c) => {
      const val = evaluate(c.node, env);
      if (c.main && !val) all = false;
      h += cell(val, c.main ? 'm' : '');
    });
    h += '</tr>';
  });
  h += '</tbody></table>';

  const legendHtml = legend.length
    ? `<div class="tt-legend">${legend.map(([l, t]) => `<span>${mathHtml(l)} = ${mathHtml(t)}</span>`).join('')}</div>`
    : '';
  const verdict = all
    ? `<p class="verdict">Prawdziwe w każdym z ${rows.length} wierszy, więc to tautologia.</p>`
    : '<p class="verdict bad">To nie jest tautologia.</p>';
  return `<div class="tt-block"><div class="tt-formula">${formulaHtml(src)}</div>${legendHtml}<div class="tt-wrap">${h}</div>${verdict}</div>`;
}

// Polish noun forms: 1 karta, 2–4 karty, 5+ kart (12–14 kart).
function plural(n, one, few, many) {
  if (n === 1) return one;
  const d = n % 10;
  const h = n % 100;
  return d >= 2 && d <= 4 && (h < 12 || h > 14) ? few : many;
}
// </logic>

const $ = (id) => document.getElementById(id);
const BY_N = new Map(CARDS.map((c) => [c.n, c]));
const ALL = CARDS.map((c) => c.n);
const KEY = 'fiszki-rachunek-zdan-v1';
const motionOff = window.matchMedia('(prefers-reduced-motion: reduce)');

let S = null;
let flipped = false;
let busy = false;

function order(ids, shuffle) {
  if (!shuffle) return ids.sort((a, b) => a - b);
  for (let i = ids.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [ids[i], ids[j]] = [ids[j], ids[i]];
  }
  return ids;
}

function fresh(dir = 'name', shuffle = false) {
  return { v: 1, dir, shuffle, round: 1, queue: order(ALL.slice(), shuffle), pos: 0, results: {}, known: [], history: [] };
}

function valid(s) {
  if (!s || s.v !== 1 || !Array.isArray(s.queue) || !s.queue.length || !s.queue.every((id) => BY_N.has(id))) return null;
  if (!Number.isInteger(s.pos) || s.pos < 0 || s.pos > s.queue.length) return null;
  const out = {
    v: 1,
    dir: s.dir === 'formula' ? 'formula' : 'name',
    shuffle: !!s.shuffle,
    round: Number.isInteger(s.round) && s.round > 0 ? s.round : 1,
    queue: s.queue.slice(),
    pos: s.pos,
    results: {},
    known: Array.isArray(s.known) ? [...new Set(s.known.filter((id) => BY_N.has(id)))] : [],
    history: [],
  };
  const res = s.results && typeof s.results === 'object' ? s.results : {};
  out.queue.slice(0, out.pos).forEach((id) => { if (res[id] === 'yes' || res[id] === 'no') out.results[id] = res[id]; });
  if (Array.isArray(s.history) && s.history.length === out.pos && s.history.every((h, i) => h && h.id === out.queue[i])) {
    out.history = s.history.map((h) => ({ id: h.id, prevKnown: !!h.prevKnown }));
  }
  return out;
}

function load() {
  try { return valid(JSON.parse(localStorage.getItem(KEY))); } catch (e) { return null; }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* no storage: progress lives for this visit only */ }
}

const current = () => BY_N.get(S.queue[S.pos]);
const finished = () => S.pos >= S.queue.length;

/* ---------- rendering ---------- */

function renderMeta() {
  $('strip').innerHTML = S.queue.map((id, i) => `<i class="${S.results[id] || (i === S.pos ? 'cur' : '')}"></i>`).join('');
  $('roundLabel').textContent = finished()
    ? `Runda ${S.round} · koniec`
    : `Runda ${S.round} · karta ${S.pos + 1} z ${S.queue.length}`;
  $('masteredLabel').innerHTML = `opanowane: <b>${S.known.length}</b>/${CARDS.length}`;
}

function renderCard() {
  const c = current();
  const head = (label, ask) => `<div class="face-head"><span>nr ${c.n}</span><span${ask ? ' class="ask"' : ''}>${label}</span></div>`;
  const formulas = (sub) => `<div class="formulas${sub ? ' sub' : ''}">${c.f.map((f) => `<div class="formula">${formulaHtml(f)}</div>`).join('')}</div>`;
  const hint = `<p class="hint">${proseHtml(c.hint)}</p>`;
  const tapFoot = '<div class="face-foot"><span class="tap-only">Stuknij, aby odwrócić</span><span class="click-only">Kliknij albo naciśnij spację, aby odwrócić</span></div>';
  const gradeFoot = '<div class="face-foot swipe-hint"><span class="no">← nie umiem</span><span class="tap-only">przesuń kartę</span><span class="yes">umiem →</span></div>';
  const body = (html) => `<div class="face-body"><div class="face-inner">${html}</div></div>`;
  let front;
  let back;
  if (S.dir === 'name') {
    front = head('Podaj wzór', true) + body(`<p class="law">${nameHtml(c)}</p>`) + tapFoot;
    back = head('Odpowiedź') + body(`<p class="law sub">${nameHtml(c)}</p>${formulas(false)}${hint}`) + gradeFoot;
  } else {
    front = head('Podaj nazwę', true) + body(formulas(false)) + tapFoot;
    back = head('Odpowiedź') + body(`<p class="law">${nameHtml(c)}</p>${formulas(true)}${hint}`) + gradeFoot;
  }
  $('front').innerHTML = front;
  $('back').innerHTML = back;
  setFlipped(false, true);
  fitFormulas();
}

function renderSummary() {
  const total = S.queue.length;
  const missed = S.queue.filter((id) => S.results[id] === 'no');
  const other = S.dir === 'name' ? 'od wzoru do nazwy' : 'od nazwy do wzoru';
  if (!missed.length) {
    const how = S.round === 1 ? 'Bez jednej pomyłki.' : `Zajęło to ${S.round} ${plural(S.round, 'rundę', 'rundy', 'rund')}.`;
    $('summary').innerHTML = `
      <div class="sum-scroll">
        <p class="sum-kicker">Koniec rundy ${S.round}</p>
        <h2 class="sum-title">Znasz wszystkie ${CARDS.length} praw</h2>
        <p class="sum-text">${how} Teraz spróbuj w drugą stronę, ${other}.</p>
      </div>
      <div class="sum-actions">
        <button type="button" class="btn btn-primary" data-act="swap">Ćwicz ${other}</button>
        <button type="button" class="btn btn-ghost" data-act="restart">Zacznij od nowa</button>
      </div>`;
    return;
  }
  const items = missed.map((id) => {
    const c = BY_N.get(id);
    return `<li><span class="num">${c.n}</span><span class="nm">${nameHtml(c)}</span></li>`;
  }).join('');
  $('summary').innerHTML = `
    <div class="sum-scroll">
      <p class="sum-kicker">Koniec rundy ${S.round}</p>
      <h2 class="sum-title">Umiesz ${total - missed.length} z ${total}</h2>
      <p class="sum-label">Do powtórki</p>
      <ul class="sum-list">${items}</ul>
    </div>
    <div class="sum-actions">
      <button type="button" class="btn btn-primary" data-act="next">Powtórz ${missed.length} ${plural(missed.length, 'kartę', 'karty', 'kart')}</button>
      <button type="button" class="btn btn-ghost" data-act="restart">Zacznij od nowa</button>
    </div>`;
}

function render(focusSummary) {
  renderMeta();
  const done = finished();
  document.body.dataset.view = done ? 'summary' : 'card';
  if (done) {
    renderSummary();
    $('btnTruth').disabled = true;
    if (focusSummary) $('summary').querySelector('.btn').focus();
  } else {
    renderCard();
  }
  $('btnUndo').disabled = S.history.length === 0;
  const isName = S.dir === 'name';
  $('dirName').setAttribute('aria-checked', String(isName));
  $('dirFormula').setAttribute('aria-checked', String(!isName));
  $('dirName').tabIndex = isName ? 0 : -1;
  $('dirFormula').tabIndex = isName ? -1 : 0;
  $('btnShuffle').setAttribute('aria-pressed', String(S.shuffle));
}

function setFlipped(v, instant) {
  flipped = v;
  const card = $('card');
  if (instant) card.style.transition = 'none';
  card.classList.toggle('flipped', v);
  if (instant) {
    void card.offsetWidth;
    card.style.transition = '';
  }
  $('front').setAttribute('aria-hidden', String(v));
  $('back').setAttribute('aria-hidden', String(!v));
  $('front').inert = v;
  $('back').inert = !v;
  $('btnTruth').disabled = !v || finished();
}

function flip() {
  if (busy || finished()) return;
  setFlipped(!flipped, false);
}

// Shrink formulas that would overflow the card, first in width, then in height.
function fitFormulas() {
  for (const face of [$('front'), $('back')]) {
    const body = face.querySelector('.face-body');
    if (!body) continue;
    const fs = [...face.querySelectorAll('.formula')];
    fs.forEach((el) => { el.style.fontSize = ''; });
    fs.forEach((el) => {
      let size = parseFloat(getComputedStyle(el).fontSize);
      let guard = 0;
      while (el.scrollWidth > el.clientWidth + 1 && size > 13 && guard++ < 20) {
        size -= 1;
        el.style.fontSize = `${size}px`;
      }
    });
    let guard = 0;
    while (body.scrollHeight > body.clientHeight + 1 && guard++ < 12) {
      let shrunk = false;
      fs.forEach((el) => {
        const size = parseFloat(getComputedStyle(el).fontSize);
        if (size > 15) { el.style.fontSize = `${size - 1}px`; shrunk = true; }
      });
      if (!shrunk) break;
    }
  }
}

/* ---------- motion ---------- */

function stamps(v) {
  $('stampYes').style.opacity = String(Math.max(0, Math.min(1, v)));
  $('stampNo').style.opacity = String(Math.max(0, Math.min(1, -v)));
}

function resetSwipe() {
  const sw = $('swipe');
  sw.style.transition = 'none';
  sw.style.transform = '';
  sw.style.opacity = '';
  stamps(0);
  void sw.offsetWidth;
  sw.style.transition = '';
}

function enter() {
  if (motionOff.matches) return;
  const sw = $('swipe');
  sw.classList.remove('enter');
  void sw.offsetWidth;
  sw.classList.add('enter');
}

function flyOut(dir, then) {
  if (motionOff.matches) { resetSwipe(); then(); return; }
  const sw = $('swipe');
  busy = true;
  sw.classList.remove('enter');
  sw.style.transition = 'transform .26s cubic-bezier(.4, 0, 1, 1), opacity .26s';
  sw.style.transform = `translateX(${dir * (sw.offsetWidth + 80)}px) rotate(${dir * 14}deg)`;
  sw.style.opacity = '0';
  setTimeout(() => {
    busy = false;
    resetSwipe();
    then();
  }, 260);
}

/* ---------- actions ---------- */

function grade(ok) {
  if (busy || finished()) return;
  const id = S.queue[S.pos];
  S.history.push({ id, prevKnown: S.known.includes(id) });
  S.results[id] = ok ? 'yes' : 'no';
  S.known = S.known.filter((k) => k !== id);
  if (ok) S.known.push(id);
  S.pos += 1;
  save();
  renderMeta();
  stamps(ok ? 1 : -1);
  flyOut(ok ? 1 : -1, () => {
    render(true);
    if (!finished()) enter();
  });
}

function undo() {
  if (busy || !S.history.length) return;
  const last = S.history.pop();
  S.pos -= 1;
  delete S.results[last.id];
  S.known = S.known.filter((k) => k !== last.id);
  if (last.prevKnown) S.known.push(last.id);
  save();
  render();
  enter();
}

function nextRound() {
  const missed = S.queue.filter((id) => S.results[id] === 'no');
  S.queue = order(missed, S.shuffle);
  S.pos = 0;
  S.results = {};
  S.history = [];
  S.round += 1;
  save();
  render();
  enter();
}

function restart(dir) {
  S = fresh(dir || S.dir, S.shuffle);
  save();
  render();
  enter();
}

function setDir(d) {
  if (S.dir === d) return;
  S.dir = d;
  save();
  render();
}

function toggleShuffle() {
  S.shuffle = !S.shuffle;
  if (!finished()) S.queue = S.queue.slice(0, S.pos).concat(order(S.queue.slice(S.pos), S.shuffle));
  save();
  render();
}

let resetArmed = null;
function disarmReset() {
  clearTimeout(resetArmed);
  resetArmed = null;
  $('btnReset').classList.remove('confirm');
  $('btnReset').querySelector('span').textContent = 'Od nowa';
}
function onReset() {
  if (!resetArmed) {
    $('btnReset').classList.add('confirm');
    $('btnReset').querySelector('span').textContent = 'Na pewno?';
    resetArmed = setTimeout(disarmReset, 3000);
    return;
  }
  disarmReset();
  restart();
}

/* ---------- truth-table sheet ---------- */

let sheetOpen = false;
let lastFocus = null;

function openSheet() {
  if (!flipped || finished() || sheetOpen) return;
  const c = current();
  $('sheetSub').innerHTML = nameHtml(c);
  $('sheetBody').innerHTML = c.f.map(tableHtml).join('');
  $('sheetBody').scrollTop = 0;
  const sh = $('sheet');
  const bd = $('backdrop');
  sh.hidden = false;
  bd.hidden = false;
  void sh.offsetWidth;
  sh.classList.add('open');
  bd.classList.add('open');
  sheetOpen = true;
  lastFocus = document.activeElement;
  $('sheetClose').focus();
}

function closeSheet() {
  if (!sheetOpen) return;
  sheetOpen = false;
  $('sheet').classList.remove('open');
  $('backdrop').classList.remove('open');
  setTimeout(() => {
    if (!sheetOpen) { $('sheet').hidden = true; $('backdrop').hidden = true; }
  }, motionOff.matches ? 0 : 300);
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}

/* ---------- input ---------- */

const sw = $('swipe');
let drag = null;
let suppressClick = false;

sw.addEventListener('pointerdown', (e) => {
  if (busy || (e.pointerType === 'mouse' && e.button !== 0)) return;
  sw.classList.remove('enter');
  drag = { id: e.pointerId, x: e.clientX, y: e.clientY, dx: 0, active: false };
});
sw.addEventListener('pointermove', (e) => {
  if (!drag || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.x;
  const dy = e.clientY - drag.y;
  if (!drag.active) {
    if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy) * 1.2) {
      drag.active = true;
      try { sw.setPointerCapture(e.pointerId); } catch (err) { /* capture is optional */ }
      sw.style.transition = 'none';
    } else {
      if (Math.abs(dy) > 12) drag = null;
      return;
    }
  }
  drag.dx = dx;
  sw.style.transform = `translateX(${dx}px) rotate(${dx / 22}deg)`;
  stamps(dx / 110);
});
function endDrag(e, cancelled) {
  if (!drag || e.pointerId !== drag.id) return;
  const d = drag;
  drag = null;
  if (!d.active) return;
  suppressClick = true;
  setTimeout(() => { suppressClick = false; }, 350);
  const threshold = Math.min(110, sw.offsetWidth * 0.28);
  if (!cancelled && Math.abs(d.dx) > threshold) {
    grade(d.dx > 0);
  } else {
    sw.style.transition = 'transform .25s cubic-bezier(.2, .8, .2, 1)';
    sw.style.transform = '';
    stamps(0);
  }
}
sw.addEventListener('pointerup', (e) => endDrag(e, false));
sw.addEventListener('pointercancel', (e) => endDrag(e, true));
sw.addEventListener('animationend', () => sw.classList.remove('enter'));

$('card').addEventListener('click', () => {
  if (suppressClick) { suppressClick = false; return; }
  flip();
});
$('btnYes').addEventListener('click', () => grade(true));
$('btnNo').addEventListener('click', () => grade(false));
$('btnUndo').addEventListener('click', undo);
$('btnTruth').addEventListener('click', openSheet);
$('btnReset').addEventListener('click', onReset);
$('btnShuffle').addEventListener('click', toggleShuffle);
$('dirName').addEventListener('click', () => setDir('name'));
$('dirFormula').addEventListener('click', () => setDir('formula'));
$('sheetClose').addEventListener('click', closeSheet);
$('backdrop').addEventListener('click', closeSheet);
$('summary').addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  if (b.dataset.act === 'next') nextRound();
  else if (b.dataset.act === 'restart') restart();
  else if (b.dataset.act === 'swap') restart(S.dir === 'name' ? 'formula' : 'name');
});

document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (sheetOpen) {
    if (e.key === 'Escape') { e.preventDefault(); closeSheet(); }
    else if (e.key === 'Tab') {
      e.preventDefault();
      const els = [$('sheetClose'), $('sheetBody')];
      const i = els.indexOf(document.activeElement);
      els[(i + (e.shiftKey ? -1 : 1) + els.length) % els.length].focus();
    }
    return;
  }
  const t = e.target;
  if (t.closest && t.closest('.segctl') && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
    e.preventDefault();
    const d = S.dir === 'name' ? 'formula' : 'name';
    setDir(d);
    $(d === 'name' ? 'dirName' : 'dirFormula').focus();
    return;
  }
  const onButton = t.tagName === 'BUTTON';
  switch (e.key) {
    case ' ':
    case 'Enter':
      if (onButton || finished()) return;
      e.preventDefault();
      flip();
      break;
    case 'ArrowRight':
    case '2':
      if (!finished()) { e.preventDefault(); grade(true); }
      break;
    case 'ArrowLeft':
    case '1':
      if (!finished()) { e.preventDefault(); grade(false); }
      break;
    case 'z':
    case 'Z':
    case 'Backspace':
      e.preventDefault();
      undo();
      break;
    case 't':
    case 'T':
      if (flipped && !finished()) { e.preventDefault(); openSheet(); }
      break;
    default:
  }
});

window.addEventListener('resize', () => { if (!finished()) fitFormulas(); });

/* ---------- boot ---------- */

function boot(data) {
  S = (data && valid(data.S)) || load() || fresh();
  render();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (!finished()) fitFormulas(); });
}
window.claude?.hot?.snapshot?.(() => ({ S }));
if (window.claude?.hot?.ready) window.claude.hot.ready(boot);
else boot(window.claude?.hot?.data ?? {});
})();
</script>
</body>
</html>
